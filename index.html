<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Hub | Port Adelaide FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:        #1a1f2e;
    --navy-mid:    #232838;
    --teal:        #0abfbf;
    --teal-dim:    #088a8a;
    --teal-pale:   #e6f9f9;
    --white:       #ffffff;
    --body-bg:     #f0f2f5;
    --card-bg:     #ffffff;
    --border:      #e2e6ed;
    --text:        #1a1f2e;
    --text-mid:    #4a5568;
    --text-light:  #8a94a6;
    --amber:       #f59e0b;
    --amber-pale:  #fffbeb;
    --amber-border:#fde68a;
    --green:       #10b981;
    --green-pale:  #ecfdf5;
    --red:         #ef4444;
    --red-pale:    #fef2f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--body-bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5; }

  /* TOPBAR */
  .topbar { background: var(--navy); padding: 0 24px; display: flex; align-items: center; gap: 12px; height: 56px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .topbar-icon { width: 32px; height: 32px; background: var(--teal); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .topbar-title { font-size: 15px; font-weight: 700; color: var(--white); }
  .topbar-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.15); margin: 0 4px; }
  .topbar-sub { font-size: 12px; color: rgba(255,255,255,0.5); }
  .topbar-spacer { flex: 1; }
  .launch-badge { background: var(--teal); color: var(--navy); font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }

  /* PAGE */
  .page { max-width: 960px; margin: 0 auto; padding: 24px 20px 40px; }

  /* HERO */
  .page-hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; background: var(--navy); border-radius: 14px; padding: 24px 28px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-title { font-size: 26px; font-weight: 800; color: var(--white); letter-spacing: -0.02em; line-height: 1.1; }
  .title-sub { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.45); display: block; margin-top: 3px; }
  .page-hero-date { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .hero-date-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); }
  .hero-date-main { font-size: 28px; font-weight: 800; color: var(--white); letter-spacing: -0.02em; line-height: 1; }
  .hero-time { display: flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 700; color: var(--teal); margin-top: 2px; }
  .dot { width: 8px; height: 8px; background: var(--teal); border-radius: 50%; animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.85)} }

  /* GRID */
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

  /* CARDS */
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card-header { padding: 14px 18px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .card-icon { font-size: 15px; }
  .card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-mid); }
  .card-body { padding: 16px 18px; }

  /* TIMELINE */
  .timeline { display: flex; flex-direction: column; }
  .time-block { position: relative; padding-left: 28px; padding-bottom: 20px; }
  .time-block:last-child { padding-bottom: 0; }
  .time-block::before { content:''; position:absolute; left:9px; top:26px; bottom:0; width:2px; background:var(--border); }
  .time-block:last-child::before { display:none; }
  .time-block::after { content:''; position:absolute; left:4px; top:5px; width:12px; height:12px; border-radius:50%; background:var(--teal); border:2px solid var(--white); box-shadow:0 0 0 2px var(--teal); }
  .time-stamp { font-size: 15px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
  .time-note { font-size: 11.5px; color: var(--text-light); font-style: italic; margin-bottom: 8px; background: #f8f9fb; border-left: 2px solid var(--teal); padding: 6px 10px; border-radius: 0 6px 6px 0; }
  .task-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .task-item { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--text); line-height: 1.4; }
  .task-dot { flex-shrink:0; width:6px; height:6px; margin-top:5px; border-radius:50%; background:var(--teal); }
  .task-text { flex: 1; }
  .owner-pill { display:inline-flex; align-items:center; background:var(--teal-pale); color:var(--teal-dim); font-size:10px; font-weight:600; padding:1px 7px; border-radius:20px; margin-left:5px; white-space:nowrap; vertical-align:middle; }

  /* RESOURCES */
  .resource-group { margin-bottom: 16px; }
  .resource-group:last-child { margin-bottom: 0; }
  .resource-group-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-light); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .not-live-badge { font-size: 9px; font-weight: 600; text-transform: none; letter-spacing: 0; background: var(--amber-pale); color: #92670a; border: 1px solid var(--amber-border); padding: 1px 7px; border-radius: 20px; }
  .link-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .link-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fafbfc; }
  .link-icon { flex-shrink:0; width:20px; height:20px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:11px; background:#edf0f5; }
  .link-icon.sp { background:#e8f0fe; }
  .link-icon.ht { background:#fff0e8; }
  .link-icon.ps { background:#e8f9f9; }
  .link-icon.doc { background:#e8f0fe; }
  .link-label-text { flex: 1; font-size: 12.5px; font-weight: 500; color: var(--text); }
  .view-pill { flex-shrink:0; display:inline-flex; align-items:center; gap:3px; background:var(--teal-pale); color:var(--teal-dim); border:1px solid #b2e8e8; border-radius:20px; padding:3px 10px; font-size:10px; font-weight:600; text-decoration:none; transition:background 0.12s, color 0.12s; }
  .view-pill:hover { background:var(--teal); color:var(--white); border-color:var(--teal); }
  .copy-btn { flex-shrink:0; background:var(--teal); border:none; border-radius:20px; padding:3px 10px; font-size:10px; font-weight:600; color:var(--white); cursor:pointer; font-family:'Inter',sans-serif; transition:background 0.12s; }
  .copy-btn:hover { background:var(--teal-dim); }
  .copy-btn.copied { background:var(--green); }

  /* PRODUCTS */
  .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .product-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fafbfc; display: flex; flex-direction: column; }
  .product-img-wrap { aspect-ratio: 1/1; overflow: hidden; background: #edf0f5; }
  .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .product-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 32px; background: #f0f2f5; }
  .product-info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .product-name { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .product-copy-btn { width: 100%; font-size: 11px; font-weight: 600; color: var(--white); padding: 6px 10px; border: none; border-radius: 20px; background: var(--teal); cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.12s; }
  .product-copy-btn:hover { background: var(--teal-dim); }
  .product-copy-btn.copied { background: var(--green); }

  /* NOTES */
  .note-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .note-item { display: flex; gap: 10px; padding: 10px 14px; background: var(--amber-pale); border: 1px solid var(--amber-border); border-left: 3px solid var(--amber); border-radius: 8px; font-size: 13px; color: var(--text); line-height: 1.5; }
  .note-item.info { background: var(--teal-pale); border-color: #b2e8e8; border-left-color: var(--teal); }
  .note-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }

  /* LOADING / ERROR */
  .loading-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-state { background: var(--red-pale); border: 1px solid #fecaca; border-radius: 12px; padding: 20px; text-align: center; color: var(--red); }

  /* FOOTER */
  .page-footer { max-width: 960px; margin: 0 auto; padding: 16px 20px 32px; text-align: center; font-size: 11px; color: var(--text-light); }

  /* MONDAY BADGE */
  .monday-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-light); margin-top: 4px; }
  .monday-dot { width: 6px; height: 6px; background: #6161ff; border-radius: 50%; }

  @media (max-width: 640px) {
    .product-grid { grid-template-columns: 1fr 1fr; }
    .page-hero { flex-direction: column; align-items: flex-start; }
    .page-hero-date { text-align: left; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-icon">⚡</div>
  <span class="topbar-title" id="topbar-title">Launch Hub</span>
  <div class="topbar-divider"></div>
  <span class="topbar-sub">Port Adelaide FC — Retail</span>
  <div class="topbar-spacer"></div>
  <span class="launch-badge" id="topbar-badge">🚀 Loading...</span>
</div>

<div class="page">

  <!-- HERO -->
  <div class="page-hero" id="hero">
    <div>
      <h1 class="page-title" id="hero-title">Loading...</h1>
      <span class="title-sub">Launch Day</span>
    </div>
    <div class="page-hero-date">
      <div class="hero-date-label">Launch</div>
      <div class="hero-date-main" id="hero-date">—</div>
      <div class="hero-time"><span class="dot"></span><span id="hero-time">—</span></div>
    </div>
  </div>

  <div class="grid" id="content">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <div>Loading from Monday.com...</div>
    </div>
  </div>

</div>

<div class="page-footer">
  Port Adelaide Football Club · Retail &amp; Merchandise
  <div class="monday-badge"><span class="monday-dot"></span> Live data from Monday.com</div>
</div>

<script src="config.js"></script>
<script>
const API = 'https://api.monday.com/v2';
const TOKEN = LAUNCH_HUB_CONFIG.MONDAY_TOKEN;
const BOARD_ID = LAUNCH_HUB_CONFIG.BOARD_ID;
const GROUPS = LAUNCH_HUB_CONFIG.GROUPS;
const COLS = LAUNCH_HUB_CONFIG.COLUMNS;

async function mondayQuery(query) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN, 'API-Version': '2024-01' },
    body: JSON.stringify({ query })
  });
  const data = await res.json();
  if (data.errors) throw new Error(data.errors[0].message);
  return data.data;
}

function getColumnValue(item, colId) {
  const col = item.column_values.find(c => c.id === colId);
  if (!col) return '';
  try {
    const parsed = JSON.parse(col.value);
    if (parsed === null) return '';
    if (colId === COLS.URL || colId === COLS.BIGCOMMERCE_URL) return parsed.url || '';
    if (colId === COLS.NOTES) return parsed.text || '';
    if (colId === COLS.SEVERITY) return parsed.label || col.text || '';
    return col.text || '';
  } catch { return col.text || ''; }
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
}

async function fetchBCImage(url) {
  if (!url) return null;
  try {
    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    const match = data.contents.match(/<meta property="og:image" content="([^"]+)"/);
    return match ? match[1] : null;
  } catch { return null; }
}

function copyToClipboard(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 2000);
  });
}

function getLinkIcon(url) {
  if (!url) return { cls: '', emoji: '🔗' };
  if (url.includes('sharepoint')) return { cls: 'sp', emoji: '📁' };
  if (url.includes('hightail')) return { cls: 'ht', emoji: '📷' };
  if (url.includes('portstore')) return { cls: 'ps', emoji: '🏬' };
  if (url.includes('.docx') || url.includes('docs')) return { cls: 'doc', emoji: '📄' };
  return { cls: '', emoji: '🔗' };
}

function buildTimeline(items) {
  // Group by time
  const byTime = {};
  items.forEach(item => {
    const time = getColumnValue(item, COLS.LAUNCH_TIME) || 'Unscheduled';
    if (!byTime[time]) byTime[time] = [];
    byTime[time].push(item);
  });

  const timeOrder = ['10:00am','10:15am','10:30am+','Unscheduled'];
  const sorted = Object.keys(byTime).sort((a, b) => {
    const ai = timeOrder.indexOf(a), bi = timeOrder.indexOf(b);
    if (ai === -1 && bi === -1) return a.localeCompare(b);
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });

  const noteMap = {
    '10:15am': 'Georgie to confirm everything online is activated & working. The following rolls out once confirmed.'
  };

  return `
    <div class="card">
      <div class="card-header"><span class="card-icon">🕐</span><span class="card-title">Launch Timeline</span></div>
      <div class="card-body">
        <div class="timeline">
          ${sorted.map(time => `
            <div class="time-block">
              <div class="time-stamp">${time}</div>
              ${noteMap[time] ? `<p class="time-note">${noteMap[time]}</p>` : ''}
              <ul class="task-list">
                ${byTime[time].map(item => {
                  const owner = getColumnValue(item, COLS.OWNER);
                  const note = getColumnValue(item, COLS.NOTES);
                  const owners = owner ? owner.split('/').map(o => `<span class="owner-pill">${o.trim()}</span>`).join('') : '';
                  return `<li class="task-item"><span class="task-dot"></span><span class="task-text">${item.name}${note ? ` <span style="color:var(--text-light);font-size:11px">— ${note}</span>` : ''}${owners}</span></li>`;
                }).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
}

function buildResources(items) {
  const websiteItems = items.filter(i => {
    const url = getColumnValue(i, COLS.URL);
    return url && url.includes('portstore');
  });
  const otherItems = items.filter(i => {
    const url = getColumnValue(i, COLS.URL);
    return url && !url.includes('portstore');
  });

  function linkRow(item, showCopy) {
    const url = getColumnValue(item, COLS.URL);
    const icon = getLinkIcon(url);
    return `
      <li class="link-item">
        <span class="link-icon ${icon.cls}">${icon.emoji}</span>
        <span class="link-label-text">${item.name}</span>
        ${url && !showCopy ? `<a href="${url}" target="_blank" class="view-pill">View ↗</a>` : ''}
        ${showCopy && url ? `<button class="copy-btn" onclick="copyToClipboard(this,'${url}')">Copy Link</button>` : ''}
      </li>`;
  }

  return `
    <div class="card">
      <div class="card-header"><span class="card-icon">🔗</span><span class="card-title">Resources</span></div>
      <div class="card-body">
        ${websiteItems.length ? `
        <div class="resource-group">
          <div class="resource-group-title">Website Links <span class="not-live-badge">⚠ Not live yet</span></div>
          <ul class="link-list">${websiteItems.map(i => linkRow(i, true)).join('')}</ul>
        </div>` : ''}
        ${otherItems.length ? `
        <div class="resource-group">
          <div class="resource-group-title">Graphics, Photography & Storytelling</div>
          <ul class="link-list">${otherItems.map(i => linkRow(i, false)).join('')}</ul>
        </div>` : ''}
      </div>
    </div>`;
}

async function buildProducts(items) {
  const productHTML = await Promise.all(items.map(async item => {
    const url = getColumnValue(item, COLS.BIGCOMMERCE_URL);
    let imgSrc = await fetchBCImage(url);
    const imgEl = imgSrc
      ? `<img src="${imgSrc}" alt="${item.name}" loading="lazy">`
      : `<div class="product-img-placeholder">👕</div>`;
    return `
      <div class="product-card">
        <div class="product-img-wrap">${imgEl}</div>
        <div class="product-info">
          <div class="product-name">${item.name}</div>
          <div>
            ${url ? `<button class="product-copy-btn" onclick="copyToClipboard(this,'${url}')">Copy Product Link</button>` : '<span style="color:var(--text-light);font-size:11px">No URL set</span>'}
          </div>
        </div>
      </div>`;
  }));

  return `
    <div class="card">
      <div class="card-header"><span class="card-icon">👕</span><span class="card-title">Full Product Assortment</span></div>
      <div class="card-body">
        <div class="product-grid">${productHTML.join('')}</div>
      </div>
    </div>`;
}

function buildNotes(items) {
  if (!items.length) return '';
  return `
    <div class="card">
      <div class="card-header"><span class="card-icon">⚠️</span><span class="card-title">Important Notes</span></div>
      <div class="card-body">
        <ul class="note-list">
          ${items.map(item => {
            const note = getColumnValue(item, COLS.NOTES);
            const severity = getColumnValue(item, COLS.SEVERITY);
            const isInfo = severity === 'Working on it';
            return `
              <li class="note-item${isInfo ? ' info' : ''}">
                <span class="note-icon">${isInfo ? 'ℹ️' : '⚠️'}</span>
                <span><strong>${item.name}</strong>${note ? ` — ${note}` : ''}</span>
              </li>`;
          }).join('')}
        </ul>
      </div>
    </div>`;
}

async function init() {
  try {
    const data = await mondayQuery(`{
      boards(ids: [${BOARD_ID}]) {
        groups { id title }
        items_page(limit: 200) {
          items {
            id name group { id }
            column_values { id value text }
          }
        }
      }
    }`);

    const board = data.boards[0];
    const allItems = board.items_page.items;

    const getGroup = (groupId) => allItems.filter(i => i.group.id === groupId);

    const launchItems  = getGroup(GROUPS.LAUNCH_INFO);
    const timelineItems = getGroup(GROUPS.TIMELINE);
    const resourceItems = getGroup(GROUPS.RESOURCES);
    const productItems  = getGroup(GROUPS.PRODUCTS);
    const noteItems     = getGroup(GROUPS.NOTES);

    // Update hero
    if (launchItems.length) {
      const launch = launchItems[0];
      const launchName = launch.name;
      const launchDate = getColumnValue(launch, COLS.LAUNCH_DATE);
      const launchTime = getColumnValue(launch, COLS.LAUNCH_TIME);
      document.getElementById('topbar-title').textContent = launchName;
      document.getElementById('topbar-badge').textContent = '🚀 Launch Day';
      document.getElementById('hero-title').textContent = launchName;
      document.getElementById('hero-date').textContent = formatDate(launchDate);
      document.getElementById('hero-time').textContent = launchTime || '—';
      document.title = `${launchName} — Launch Hub | Port Adelaide FC`;
    }

    // Build sections
    const timelineHTML  = buildTimeline(timelineItems);
    const resourcesHTML = buildResources(resourceItems);
    const productsHTML  = await buildProducts(productItems);
    const notesHTML     = buildNotes(noteItems);

    document.getElementById('content').innerHTML = [timelineHTML, resourcesHTML, productsHTML, notesHTML].filter(Boolean).join('');

  } catch (err) {
    document.getElementById('content').innerHTML = `
      <div class="error-state">
        <strong>Could not load data from Monday.com</strong><br>
        <span style="font-size:12px;opacity:0.8">${err.message}</span>
      </div>`;
  }
}

init();
</script>
</body>
</html>
