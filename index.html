<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Hub | Port Adelaide FC</title>
<script src="https://cdn.jsdelivr.net/npm/monday-sdk-js/dist/main.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a1f2e;--teal:#0abfbf;--teal-dim:#088a8a;--teal-pale:#e6f9f9;--white:#fff;--body-bg:#f0f2f5;--card-bg:#fff;--border:#e2e6ed;--text:#1a1f2e;--text-mid:#4a5568;--text-light:#8a94a6;--amber:#f59e0b;--amber-pale:#fffbeb;--amber-border:#fde68a;--green:#10b981;--green-pale:#ecfdf5;--red:#ef4444;--red-pale:#fef2f2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--body-bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;min-height:100vh}

/* TOPBAR */
.topbar{background:var(--navy);padding:0 24px;display:flex;align-items:center;gap:12px;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.topbar-icon{width:32px;height:32px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:700;color:#fff}
.topbar-divider{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.5)}
.topbar-spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 12px 4px 4px}
.user-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.3)}
.user-name{font-size:11px;font-weight:600;color:rgba(255,255,255,.85)}

/* PAGE */
.page{max-width:1000px;margin:0 auto;padding:28px 20px 60px}

/* HOME HEADER */
.home-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.home-title-group h1{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.home-title-group p{font-size:13px;color:var(--text-light);margin-top:4px}
.home-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.my-tasks-btn{display:flex;align-items:center;gap:7px;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s;text-decoration:none}
.my-tasks-btn:hover{background:#232838}
.my-tasks-count{background:var(--teal);color:var(--navy);font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:18px;text-align:center}
.new-launch-btn{display:flex;align-items:center;gap:6px;background:var(--teal);color:var(--navy);border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s}
.new-launch-btn:hover{background:var(--teal-dim);color:#fff}

/* SECTION */
.section{margin-bottom:28px}
.section-heading{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-light);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-heading::after{content:'';flex:1;height:1px;background:var(--border)}

/* LAUNCH CARDS GRID */
.launches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

/* LAUNCH CARD */
.launch-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;position:relative;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit}
.launch-card:hover{border-color:var(--teal);box-shadow:0 4px 16px rgba(10,191,191,.1);transform:translateY(-1px)}
.launch-card.live{border-color:var(--teal);border-width:2px;box-shadow:0 0 0 3px rgba(10,191,191,.1)}
.launch-card.past{opacity:.7}

.launch-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.launch-card-name{font-size:15px;font-weight:700;color:var(--navy);line-height:1.3}
.status-badge{flex-shrink:0;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.status-badge.upcoming{background:#eff6ff;color:#1e40af}
.status-badge.live{background:var(--teal-pale);color:var(--teal-dim);border:1px solid #b2e8e8}
.status-badge.past{background:#f1f5f9;color:#64748b}
.live-dot{display:inline-block;width:6px;height:6px;background:var(--teal);border-radius:50%;margin-right:4px;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

.launch-card-date{font-size:13px;font-weight:600;color:var(--text-mid);display:flex;align-items:center;gap:6px}
.launch-card-date-icon{font-size:13px}

.launch-card-stats{display:flex;gap:10px;flex-wrap:wrap}
.stat-chip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-light);background:#f8f9fb;border:1px solid var(--border);padding:3px 9px;border-radius:20px}
.stat-chip.has-open{color:var(--amber);background:var(--amber-pale);border-color:var(--amber-border)}
.stat-chip.all-done{color:var(--green);background:var(--green-pale);border-color:#6ee7b7}

.launch-card-footer{display:flex;align-items:center;justify-content:flex-end}
.view-btn{font-size:11px;font-weight:600;color:var(--teal);display:flex;align-items:center;gap:4px}

/* EMPTY STATE */
.home-empty{text-align:center;padding:60px 20px;background:var(--card-bg);border:1.5px dashed var(--border);border-radius:14px}
.home-empty h2{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:10px}
.home-empty p{color:var(--text-light);margin-bottom:20px;max-width:360px;margin-left:auto;margin-right:auto}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.2);position:relative}
.modal-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:18px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-light)}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:600;color:var(--text-mid);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block}
.form-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);background:#fff;outline:none;transition:border-color .12s}
.form-input:focus{border-color:var(--teal)}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.btn-primary{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn-primary:hover{background:var(--teal-dim)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:#f0f2f5;color:var(--text-mid);border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}

/* TOAST */
.saving-toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:600;z-index:300;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
.saving-toast.show{opacity:1;transform:translateY(0)}
.saving-toast.success{background:var(--green)}
.saving-toast.error{background:var(--red)}

/* LOADING */
.loading-state{text-align:center;padding:60px 20px;color:var(--text-light)}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* FOOTER */
.page-footer{max-width:1000px;margin:0 auto;padding:0 20px 32px;text-align:center;font-size:11px;color:var(--text-light)}
.monday-badge{display:inline-flex;align-items:center;gap:5px;margin-top:4px}
.monday-dot{width:6px;height:6px;background:#6161ff;border-radius:50%}

@media(max-width:600px){.launches-grid{grid-template-columns:1fr}.home-header{flex-direction:column}.home-actions{width:100%}.my-tasks-btn,.new-launch-btn{flex:1;justify-content:center}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-icon">⚡</div>
  <span class="topbar-title">Launch Hub</span>
  <div class="topbar-divider"></div>
  <span class="topbar-sub">Port Adelaide FC</span>
  <div class="topbar-spacer"></div>
  <div class="user-chip" id="user-chip" style="display:none">
    <img class="user-avatar" id="user-avatar" src="" alt="">
    <span class="user-name" id="user-name"></span>
  </div>
</div>

<div class="page">
  <div class="home-header">
    <div class="home-title-group">
      <h1>Retail Launches</h1>
      <p>Select a launch to view the hub, or create a new one.</p>
    </div>
    <div class="home-actions">
      <button class="my-tasks-btn" id="my-tasks-btn" onclick="goToMyTasks()">
        🗂️ My Tasks <span class="my-tasks-count" id="my-tasks-count" style="display:none">0</span>
      </button>
      <button class="new-launch-btn" onclick="openNewLaunchModal()">+ New Launch</button>
    </div>
  </div>

  <div id="home-content">
    <div class="loading-state"><div class="loading-spinner"></div><div>Loading launches...</div></div>
  </div>
</div>

<div class="page-footer">
  Port Adelaide Football Club · Retail &amp; Merchandise
  <div class="monday-badge"><span class="monday-dot"></span> Powered by Monday.com</div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<div class="saving-toast" id="toast"></div>

<script src="config.js"></script>
<script>
const mondaySDK = window.monday || null;
const API = 'https://api.monday.com/v2';
const TOKEN = LAUNCH_HUB_CONFIG.MONDAY_TOKEN;
const BOARD_ID = LAUNCH_HUB_CONFIG.BOARD_ID;
const GROUPS = LAUNCH_HUB_CONFIG.GROUPS;
const COLS = LAUNCH_HUB_CONFIG.COLUMNS;

let currentUserId = null;
let currentUser = null;
let allLaunchData = [];   // { name, date, time, taskStats }

const PAFC_USERS = [
  {"id":"82646896","name":"Georgie Morris","photo":"https://files.monday.com/use1/photos/82646896/thumb/82646896-user_photo_initials_2025_09_09_04_39_35.png?1757392775"},
  {"id":"46104905","name":"Mike Hawkins","photo":"https://files.monday.com/use1/photos/46104905/thumb/46104905-user_photo_initials_2023_07_25_06_31_13.png?1690266673"},
  {"id":"35080765","name":"Steve Frank","photo":"https://files.monday.com/use1/photos/35080765/thumb/35080765-user_photo_initials_2022_09_27_06_29_54.png?1664260194"},
  {"id":"102504354","name":"Samuel Gorgone","photo":"https://files.monday.com/use1/photos/102504354/thumb/102504354-user_photo_initials_2026_06_01_01_11_36.png?1780276296"},
  {"id":"44397410","name":"Simon Buckley","photo":"https://files.monday.com/use1/photos/44397410/thumb/44397410-user_photo_initials_2023_06_13_04_53_20.png?1686632000"},
  {"id":"29892421","name":"Andrew Fuss","photo":"https://files.monday.com/use1/photos/29892421/thumb/29892421-user_photo_initials_2022_04_22_01_04_59.png?1650589499"},
  {"id":"33551309","name":"Ruby McHaffie","photo":"https://files.monday.com/use1/photos/33551309/thumb/33551309-user_photo_2023_04_18_05_41_20.png?1681796480"},
  {"id":"51529712","name":"Matthew Richardson","photo":"https://files.monday.com/use1/photos/51529712/thumb/51529712-user_photo_initials_2023_11_08_05_10_47.png?1699420247"},
  {"id":"27582813","name":"Isabel Gawel","photo":"https://files.monday.com/use1/photos/27582813/thumb/27582813-user_photo_initials_2022_01_31_23_09_17.png?1643670557"},
  {"id":"102823072","name":"Tessa Briscoe","photo":"https://files.monday.com/use1/photos/102823072/thumb/102823072-user_photo_initials_2026_04_28_02_56_09.png?1777344969"},
  {"id":"70608708","name":"Jarrod Pettit","photo":"https://files.monday.com/use1/photos/70608708/thumb/70608708-user_photo_initials_2025_01_14_03_21_48.png?1736824908"}
];

// ── SDK ──
async function initSDK() {
  if (!mondaySDK) return;
  try {
    mondaySDK.setToken(TOKEN);
    const ctx = await mondaySDK.get('context');
    currentUserId = String(ctx?.data?.user?.id || '');
    currentUser = PAFC_USERS.find(u => u.id === currentUserId) || null;
    if (currentUser) {
      document.getElementById('user-chip').style.display = 'flex';
      document.getElementById('user-avatar').src = currentUser.photo;
      document.getElementById('user-name').textContent = currentUser.name.split(' ')[0];
    }
  } catch(e) { console.warn('SDK unavailable:', e); }
}

// ── API ──
async function mondayQuery(query) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN, 'API-Version': '2024-01' },
    body: JSON.stringify({ query })
  });
  const d = await res.json();
  if (d.errors) throw new Error(d.errors[0].message);
  return d.data;
}

// ── HELPERS ──
function getCol(item, colId) {
  const col = item.column_values?.find(c => c.id === colId);
  if (!col || !col.value || col.value === 'null') return '';
  try {
    const p = JSON.parse(col.value);
    if (p === null) return '';
    if (colId === COLS.LAUNCH_DATE || colId === COLS.TASK_DUE) return p.date || '';
    if (colId === COLS.TASK_ASSIGNEE) return p;
    if (colId === COLS.TASK_STATUS) return p.label || col.text || '';
    return col.text || '';
  } catch { return col.text || ''; }
}

function getAssigneeIds(item) {
  const col = item.column_values?.find(c => c.id === COLS.TASK_ASSIGNEE);
  if (!col || !col.value || col.value === 'null') return [];
  try {
    const p = JSON.parse(col.value);
    return (p.personsAndTeams || []).filter(x => x.kind === 'person').map(x => String(x.id));
  } catch { return []; }
}

function formatDate(d) {
  if (!d) return null;
  return new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function getLaunchStatus(dateStr) {
  if (!dateStr) return 'upcoming';
  const today = new Date(); today.setHours(0,0,0,0);
  const launch = new Date(dateStr + 'T00:00:00');
  const diff = Math.round((launch - today) / 86400000);
  if (diff < 0) return 'past';
  if (diff === 0) return 'live';
  return 'upcoming';
}

function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'saving-toast show' + (type ? ' ' + type : '');
  setTimeout(() => { t.className = 'saving-toast'; }, 2500);
}

function openModal(title, body, actions) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOnOverlay(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

// ── LOAD DATA ──
async function loadHomeData() {
  const data = await mondayQuery(`{
    boards(ids: [${BOARD_ID}]) {
      items_page(limit: 500) {
        items { id name group { id } column_values { id value text } }
      }
    }
  }`);
  const items = data.boards[0].items_page.items;

  // Collect all launches
  const nameSet = new Set();
  items.forEach(i => { const l = getCol(i, COLS.LAUNCH); if (l && l !== '__config_department__') nameSet.add(l); });

  // Build launch data objects
  allLaunchData = Array.from(nameSet).map(launchName => {
    const launchItems = items.filter(i => getCol(i, COLS.LAUNCH) === launchName);
    const infoItem = launchItems.find(i => i.group.id === GROUPS.LAUNCH_INFO);
    const tasks = launchItems.filter(i => i.group.id === GROUPS.TASKS);
    const openTasks = tasks.filter(t => {
      const s = getCol(t, COLS.TASK_STATUS); return s !== 'Completed';
    });
    const myTasks = currentUserId ? tasks.filter(t => getAssigneeIds(t).includes(currentUserId) && getCol(t, COLS.TASK_STATUS) !== 'Completed') : [];
    const date = infoItem ? getCol(infoItem, COLS.LAUNCH_DATE) : '';
    return {
      name: launchName,
      date,
      time: infoItem ? getCol(infoItem, COLS.LAUNCH_TIME) : '',
      status: getLaunchStatus(date),
      totalTasks: tasks.length,
      openTasks: openTasks.length,
      completedTasks: tasks.length - openTasks.length,
      myOpenTasks: myTasks.length
    };
  });

  // Sort: live first, then upcoming by date asc, then past by date desc
  allLaunchData.sort((a, b) => {
    const order = { live: 0, upcoming: 1, past: 2 };
    if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
    if (a.status === 'past') return (b.date || '').localeCompare(a.date || '');
    return (a.date || '9999').localeCompare(b.date || '9999');
  });

  // Update My Tasks badge
  if (currentUserId) {
    const myTotal = allLaunchData.reduce((sum, l) => sum + l.myOpenTasks, 0);
    const badge = document.getElementById('my-tasks-count');
    if (myTotal > 0) { badge.textContent = myTotal; badge.style.display = ''; }
  }
}

// ── RENDER HOME ──
function renderHome() {
  if (!allLaunchData.length) {
    document.getElementById('home-content').innerHTML = `
      <div class="home-empty">
        <h2>No launches yet</h2>
        <p>Create your first launch to get started.</p>
        <button class="new-launch-btn" onclick="openNewLaunchModal()" style="margin:0 auto;display:inline-flex">+ Create First Launch</button>
      </div>`;
    return;
  }

  const groups = { live: [], upcoming: [], past: [] };
  allLaunchData.forEach(l => groups[l.status].push(l));

  let html = '';

  if (groups.live.length) {
    html += `<div class="section"><div class="section-heading">🟢 Live Now</div><div class="launches-grid">${groups.live.map(launchCard).join('')}</div></div>`;
  }
  if (groups.upcoming.length) {
    html += `<div class="section"><div class="section-heading">📅 Upcoming</div><div class="launches-grid">${groups.upcoming.map(launchCard).join('')}</div></div>`;
  }
  if (groups.past.length) {
    html += `<div class="section"><div class="section-heading">✓ Past</div><div class="launches-grid">${groups.past.map(launchCard).join('')}</div></div>`;
  }

  document.getElementById('home-content').innerHTML = html;
}

function launchCard(launch) {
  const statusLabel = { live: '<span class="live-dot"></span>Live', upcoming: 'Upcoming', past: 'Past' }[launch.status];
  const taskChip = launch.totalTasks === 0
    ? `<span class="stat-chip">No tasks yet</span>`
    : launch.openTasks === 0
      ? `<span class="stat-chip all-done">✓ All tasks done</span>`
      : `<span class="stat-chip has-open">🗂️ ${launch.openTasks} open task${launch.openTasks !== 1 ? 's' : ''}</span>`;
  const myTaskChip = currentUserId && launch.myOpenTasks > 0
    ? `<span class="stat-chip has-open">👤 ${launch.myOpenTasks} assigned to me</span>` : '';

  return `<a class="launch-card ${launch.status}" href="launch.html?launch=${encodeURIComponent(launch.name)}">
    <div class="launch-card-header">
      <div class="launch-card-name">${launch.name}</div>
      <span class="status-badge ${launch.status}">${statusLabel}</span>
    </div>
    <div class="launch-card-date">
      <span class="launch-card-date-icon">📅</span>
      ${launch.date ? formatDate(launch.date) + (launch.time ? ` · ${launch.time}` : '') : '<span style="color:var(--text-light)">No date set</span>'}
    </div>
    <div class="launch-card-stats">${taskChip}${myTaskChip}</div>
    <div class="launch-card-footer"><span class="view-btn">View Hub →</span></div>
  </a>`;
}

// ── MY TASKS ──
function goToMyTasks() {
  // Go to launch.html on tasks tab, pre-filtered to current user
  const url = currentUserId
    ? `launch.html?tab=tasks&user=${currentUserId}`
    : `launch.html?tab=tasks`;
  window.location.href = url;
}

// ── NEW LAUNCH MODAL ──
function openNewLaunchModal() {
  openModal('Create New Launch', `
    <div class="form-group"><label class="form-label">Launch Name</label><input class="form-input" id="f-name" placeholder="e.g. SDNR 2026" autofocus></div>
    <div class="form-group"><label class="form-label">Launch Date</label><input class="form-input" id="f-date" type="date"></div>
    <div class="form-group"><label class="form-label">Launch Time</label><input class="form-input" id="f-time" placeholder="e.g. 10:00am"></div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn-primary" onclick="createLaunch()">Create Launch</button>`);
  setTimeout(() => document.getElementById('f-name')?.focus(), 50);
}

async function createLaunch() {
  const name = document.getElementById('f-name').value.trim();
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value.trim();
  if (!name) { alert('Launch name is required'); return; }
  if (allLaunchData.find(l => l.name === name)) { alert('A launch with this name already exists'); return; }
  const btn = document.querySelector('#modal-actions .btn-primary');
  btn.disabled = true; btn.textContent = 'Creating...';
  try {
    const colVals = JSON.stringify(JSON.stringify({
      [COLS.LAUNCH]: name,
      [COLS.LAUNCH_DATE]: date ? { date } : null,
      [COLS.LAUNCH_TIME]: time
    }));
    await mondayQuery(`mutation { create_item(board_id: ${BOARD_ID}, group_id: "${GROUPS.LAUNCH_INFO}", item_name: ${JSON.stringify(name)}, column_values: ${colVals}) { id } }`);
    closeModal();
    toast('Launch created!', 'success');
    // Navigate straight into the new launch
    setTimeout(() => { window.location.href = `launch.html?launch=${encodeURIComponent(name)}`; }, 600);
  } catch(e) { toast('Error: ' + e.message, 'error'); btn.disabled = false; btn.textContent = 'Create Launch'; }
}

// ── INIT ──
async function init() {
  try {
    await initSDK();
    await loadHomeData();
    renderHome();
  } catch(e) {
    document.getElementById('home-content').innerHTML = `
      <div style="background:var(--red-pale);border:1px solid #fecaca;border-radius:12px;padding:20px;text-align:center;color:var(--red)">
        <strong>Could not load from Monday.com</strong><br>
        <span style="font-size:12px;opacity:.8">${e.message}</span>
      </div>`;
  }
}

init();
</script>
