// ── LINK CARD EDITORS ─────────────────────────────────────────────────────
function editResLink(id, titleLabel) {
  var item = getItem(id);
  var url = gcv(item, C.resUrl);
  openModal('Edit — ' + titleLabel,
    '<div class="form-group"><label>URL</label><input type="url" id="frl_url" value="' + esc(url) + '" placeholder="https://portadelaide.sharepoint.com/…"></div>',
    function() {
      return setCol(id, BOARD_ID, C.resUrl, document.getElementById('frl_url').value.trim());
    }, false, null, 'Save');
  setTimeout(function() { var e = document.getElementById('frl_url'); if (e) { e.focus(); e.select(); } }, 50);
}

function addResLink(type, titleLabel) {
  openModal('Add — ' + titleLabel,
    '<div class="form-group"><label>URL</label><input type="url" id="frl_url" placeholder="https://…"></div>',
    function() {
      var url = document.getElementById('frl_url').value.trim();
      if (!url) throw new Error('URL required');
      var cv = {}; cv[C.resType] = type; cv[C.resUrl] = { url: url, text: url };
      return createItem(G.resources_tab, titleLabel, cv);
    }, false, null, 'Save');
  setTimeout(function() { document.getElementById('frl_url').focus(); }, 50);
}

// ── ASSET SLOT EDITORS ────────────────────────────────────────────────────
function editAssetSlot(slotKey, existingItem) {
  var slot = ASSET_SLOTS.find(function(s) { return s.key === slotKey; });
  var url = existingItem ? gcv(existingItem, C.resUrl) : '';
  openModal('Upload / Link — ' + (slot ? slot.name : slotKey),
    '<div class="form-group"><label>File URL (SharePoint, Google Drive, CDN, etc.)</label>'
    + '<input type="url" id="fas_url" value="' + esc(url) + '" placeholder="https://…"></div>'
    + '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.6">'
    + '💡 <strong>How to share from SharePoint:</strong> Open the file → Share → Copy link → Paste above. '
    + 'For Google Drive: right-click → Get link → Anyone with link → Copy.'
    + '</div>',
    function() {
      var url = document.getElementById('fas_url').value.trim();
      if (!url) throw new Error('URL required');
      if (existingItem) {
        return setCol(existingItem.id, BOARD_ID, C.resUrl, url);
      } else {
        var cv = {};
        cv[C.resType] = 'asset';
        cv[C.resAssetKey] = slotKey;
        cv[C.resUrl] = { url: url, text: url };
        return createItem(G.resources_tab, slot ? slot.name : slotKey, cv);
      }
    }, existingItem ? true : false, existingItem ? existingItem.id : null, existingItem ? 'Update' : 'Save Link');
  setTimeout(function() { var e = document.getElementById('fas_url'); if (e) { e.focus(); e.select(); } }, 50);
}

function removeAssetSlot(id) {
  if (!confirm('Remove this asset link?')) return;
  deleteItemApi(id).then(function() { toast('Removed'); loadData(); });
}

// ── RENDER ────────────────────────────────────────────────────────────────
// ── ASSET FILE UPLOAD ─────────────────────────────────────────────────────
// Uploads directly to monday using the file upload API, then stores the
// public URL in C.resUrl so it can be downloaded by anyone.

function handleAssetUpload(inputEl, slotKey, existingItemId) {
  var file = inputEl.files[0];
  if (!file) return;
  uploadAssetFile(file, slotKey, existingItemId);
}

function handleAssetDrop(event, slotKey, existingItemId) {
  var file = event.dataTransfer.files[0];
  if (!file) return;
  uploadAssetFile(file, slotKey, existingItemId);
}

function uploadAssetFile(file, slotKey, existingItemId) {
  var slot = ASSET_SLOTS.find(function(s) { return s.key === slotKey; });
  var dropEl = document.getElementById('drop-' + slotKey);
  if (dropEl) dropEl.querySelector('.asset-drop-label').innerHTML = '<span style="color:var(--teal)">Uploading ' + esc(file.name) + '…</span>';

  // Step 1: If no item exists yet, create one first
  var getOrCreateItem = existingItemId
    ? Promise.resolve(existingItemId)
    : (function() {
        var cv = {};
        cv[C.resType] = 'asset';
        cv[C.resAssetKey] = slotKey;
        return api(
          'mutation($bid:ID!,$gid:String!,$n:String!,$cv:JSON!){create_item(board_id:$bid,group_id:$gid,item_name:$n,column_values:$cv){id}}',
          { bid: BOARD_ID, gid: G.resources_tab, n: slot ? slot.name : slotKey, cv: JSON.stringify(cv) }
        ).then(function(r) {
          var d = r.data || r;
          return d.create_item.id;
        });
      })();

  getOrCreateItem.then(function(itemId) {
    // Step 2: Upload file to the monday Files column via multipart form
    var formData = new FormData();
    var query = 'mutation($file:File!,$itemId:ID!,$columnId:String!){add_file_to_column(item_id:$itemId,column_id:$columnId,file:$file){id url}}';
    formData.append('query', query);
    formData.append('variables[itemId]', itemId);
    formData.append('variables[columnId]', C.resFile);
    formData.append('variables[file]', file, file.name);

    // Use fetch directly for multipart (SDK can't handle it)
    var token = localStorage.getItem('ps_launch_hub_token') || '';
    var headers = { 'API-Version': '2024-01' };
    if (token) headers['Authorization'] = token;
    // If inside monday SDK, get the session token
    if (mondayClient) {
      return mondayClient.get('sessionToken').then(function(res) {
        headers['Authorization'] = res.data || token;
        return doUpload(formData, headers, itemId);
      }).catch(function() {
        return doUpload(formData, headers, itemId);
      });
    } else {
      return doUpload(formData, headers, itemId);
    }
  })
  .catch(function(e) {
    toast('Upload failed: ' + e.message, true);
    if (dropEl) dropEl.querySelector('.asset-drop-label').innerHTML = '<strong>Click to upload</strong> or drag & drop<br><span style="font-size:10px">PDF, PNG, JPG, AI, PSD, MP4…</span>';
  });
}

function doUpload(formData, headers, itemId) {
  return fetch('https://api.monday.com/v2/file', {
    method: 'POST',
    headers: headers,
    body: formData
  })
  .then(function(r) { return r.json(); })
  .then(function(r) {
    if (r.errors && r.errors.length) throw new Error(r.errors[0].message);
    var fileData = r.data && r.data.add_file_to_column;
    if (fileData && fileData.url) {
      // Also save the URL to resUrl for display/download
      return setCol(itemId, BOARD_ID, C.resUrl, fileData.url).then(function() {
        toast('File uploaded ✓');
        loadData();
      });
    } else {
      // File uploaded but no public URL returned — still reload to show from Files column
      toast('File uploaded ✓');
      loadData();
    }
  });
}

function renderResources(g) {
  // Split items into types
  var briefItem   = g.resources_tab.find(function(i) { return gcv(i, C.resType) === 'brief'; });
  var articleItem = g.resources_tab.find(function(i) { return gcv(i, C.resType) === 'article'; });
  var imageryItem = g.resources_tab.find(function(i) { return gcv(i, C.resType) === 'imagery'; });
  var assetItems  = g.resources_tab.filter(function(i) { return gcv(i, C.resType) === 'asset'; });

  // ── Link Cards ──────────────────────────────────────────────────────────
  function linkCard(icon, title, desc, item, type) {
    var url = item ? gcv(item, C.resUrl) : '';
    var hasUrl = url && url.indexOf('http') === 0;
    // Always show a "＋ Add" or "Open" button — never invisible
    var actionBtn = hasUrl
      ? '<a href="' + esc(url) + '" target="_blank" class="res-btn teal" onclick="event.stopPropagation()">Open ↗</a>'
      : '<button class="res-btn" style="background:var(--bg);color:var(--muted);border:1px solid var(--border)" onclick="' + (item ? 'editResLink(\'' + item.id + '\',\'' + esc(title) + '\')' : 'addResLink(\'' + type + '\',\'' + esc(title) + '\')') + ';event.stopPropagation()">＋ Add Link</button>';
    var editCta = item
      ? 'onclick="editResLink(\'' + item.id + '\',\'' + esc(title) + '\')"'
      : 'onclick="addResLink(\'' + type + '\',\'' + esc(title) + '\')"';
    return '<div class="res-link-card" ' + editCta + '>'
      + '<div class="res-link-card-left">'
      + '<span class="res-link-icon">' + icon + '</span>'
      + '<div class="res-link-title">' + esc(title) + '</div>'
      + '<div class="res-link-desc">' + esc(desc) + '</div>'
      + '</div>'
      + '<div style="flex-shrink:0">' + actionBtn + '</div>'
      + '</div>';
  }

  var linksHTML =
    '<div class="res-links-grid">'
    + linkCard('📖', 'Storytelling Brief', 'Creative direction & narrative for this launch', briefItem, 'brief')
    + linkCard('📰', 'Internal Article', 'Internal comms article for the launch', articleItem, 'article')
    + linkCard('🖼️', 'Approved Retail Imagery', 'Final approved photography & imagery', imageryItem, 'imagery')
    + linkCard('📸', 'Approved Campaign Imagery', 'Campaign photography approved for use', g.resources_tab.find(function(i){ return gcv(i,C.resType)==='campaign-imagery';})||null, 'campaign-imagery')
    + '</div>';

  // ── Asset Slots — with real file upload via monday Files API ─────────────
  var assetMap = {};
  assetItems.forEach(function(item) { assetMap[gcv(item, C.resAssetKey)] = item; });

  var assetsHTML = '<div class="asset-grid">' + ASSET_SLOTS.map(function(slot) {
    var item = assetMap[slot.key] || null;
    var url = item ? gcv(item, C.resUrl) : '';
    var hasFile = url && url.indexOf('http') === 0;
    var tag = hasFile
      ? '<span class="asset-slot-tag asset-tag-live">✓ Uploaded</span>'
      : '<span class="asset-slot-tag asset-tag-tbc">Pending</span>';

    var preview = hasFile
      ? '<div class="asset-preview">'
        + (url.match(/\.(jpg|jpeg|png|gif|webp|svg)(\?|$)/i)
            ? '<img src="' + esc(url) + '" onerror="this.parentNode.innerHTML=\'<div class=\\\"asset-preview-empty\\\"><span>' + slot.icon + '</span><p>File Linked</p></div>\'">'
            : '<div class="asset-preview-empty"><span>' + slot.icon + '</span><p>File Linked</p></div>')
        + '</div>'
      : '<div class="asset-preview"><div class="asset-preview-empty"><span>' + slot.icon + '</span><p>No file yet</p></div></div>';

    // File upload input — uploads directly to monday via the Files API
    var itemIdForUpload = item ? item.id : '__new__' + slot.key;
    var uploadArea = '<div class="asset-drop" id="drop-' + slot.key + '" '
      + 'onclick="document.getElementById(\'fu-' + slot.key + '\').click()" '
      + 'ondragover="event.preventDefault();this.classList.add(\'dragover\')" '
      + 'ondragleave="this.classList.remove(\'dragover\')" '
      + 'ondrop="event.preventDefault();this.classList.remove(\'dragover\');handleAssetDrop(event,\'' + slot.key + '\',' + (item ? item.id : 'null') + ')">'
      + '<input type="file" id="fu-' + slot.key + '" style="display:none" onchange="handleAssetUpload(this,\'' + slot.key + '\',' + (item ? item.id : 'null') + ')">'
      + '<div class="asset-drop-label"><strong>Click to upload</strong> or drag & drop<br>'
      + '<span style="font-size:10px">PDF, PNG, JPG, AI, PSD, MP4…</span></div>'
      + '</div>';

    var actions = '<div class="asset-actions">'
      + (hasFile
          ? '<a href="' + esc(url) + '" target="_blank" class="asset-btn asset-btn-dl">⬇ Download</a>'
            + '<button class="asset-btn asset-btn-edit" onclick="editAssetSlot(\'' + slot.key + '\',' + (item ? 'getItem(' + item.id + ')' : 'null') + ')">✎ Replace link</button>'
            + '<button class="asset-btn asset-btn-remove" onclick="removeAssetSlot(\'' + item.id + '\')">✕</button>'
          : '')
      + '</div>';

    return '<div class="asset-slot">'
      + '<div class="asset-slot-head">'
      + '<span class="asset-slot-name">' + slot.icon + ' ' + esc(slot.name) + '</span>'
      + tag
      + '</div>'
      + '<div class="asset-slot-body">'
      + preview
      + uploadArea
      + actions
      + '</div>'
      + '</div>';
  }).join('') + '</div>';

  document.getElementById('resourcesContent').innerHTML =
    '<div class="section">'
    + secHead('01', 'Links', 'Key Documents', '', '')
    + linksHTML
    + '</div>'
    + '<div class="section">'
    + secHead('02', 'Assets', 'Approved Retail Assets', '', '')
    + '<p style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6">Upload files directly — team members can download from here. Files are stored in the monday board.</p>'
    + assetsHTML
    + '</div>';
}

// ════════════════════════════════════════════════════════════════════
//  RENDER DISPATCHER
// ════════════════════════════════════════════════════════════════════
function render(items) {
  allItems = items;
  bulletMap = {}; subitemMap = {};
  var grouped = { story:[], timeline:[], graphics:[], resources:[], products:[], shoot:[], resources_tab:[], calendar:[], actions:[] };
  items.forEach(function(item) {
    var gid = item.group ? item.group.id : '';
    if      (gid === G.story)     grouped.story.push(item);
    else if (gid === G.timeline)  grouped.timeline.push(item);
    else if (gid === G.graphics)  grouped.graphics.push(item);
    else if (gid === G.resources) grouped.resources.push(item);
    else if (gid === G.products)  grouped.products.push(item);
    else if (gid === G.shoot)     grouped.shoot.push(item);
    else if (gid === G.resources_tab) grouped.resources_tab.push(item);
    else if (gid === G.calendar)      grouped.calendar.push(item);
    else if (gid === G.actions)   grouped.actions.push(item);
    if (item.subitems) {
      item.subitems.forEach(function(s) {
        var sku = '', bc = '';
        if (s.column_values) s.column_values.forEach(function(cv) {
          if (cv.id === C.sku) sku = cv.text || '';
          if (cv.id === C.barcode) bc = cv.text || '';
        });
        subitemMap[s.id] = { name: s.name, sku: sku, barcode: bc };
        bulletMap[s.id] = s.name;
      });
    }
  });
  renderOverview(grouped);
  renderProducts(grouped);
  renderShoot(grouped);
  renderResources(grouped);
  renderTimeline(grouped);
  renderActions(grouped);
}

// ════════════════════════════════════════════════════════════════════
//  LOAD
// ════════════════════════════════════════════════════════════════════
function loadData() {
  var btn = document.getElementById('rbtn');
  btn.classList.add('loading');
  setStatus('loading', 'Loading from Monday.com…');
  api('query($bid:[ID!]){boards(ids:$bid){items_page(limit:200){items{id name group{id} column_values{id text value} subitems{id name column_values{id text}}}}}}',
    { bid: [BOARD_ID] })
  .then(function(j) {
    // Handle both fetch shape { data: { boards: [...] } } and SDK shape { boards: [...] }
    var d = j.data || j;
    var board = d.boards && d.boards[0];
    if (!board) throw new Error('Board not found — check BOARD_ID in config');
    render(board.items_page.items);
    setStatus('live', 'Loaded from Monday.com — ' + new Date().toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit' }));
  })
  .catch(function(e) {
    if (e.message && e.message.indexOf('No API token') === 0) return; // overlay shown already
    setStatus('error', 'Load failed: ' + e.message);
  })
  .finally(function() { btn.classList.remove('loading'); });
}

function reload() { loadData(); }
