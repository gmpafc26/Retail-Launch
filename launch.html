<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Hub | Port Adelaide FC</title>
<script src="https://cdn.jsdelivr.net/npm/monday-sdk-js/dist/main.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a1f2e;--navy-mid:#232838;--teal:#0abfbf;--teal-dim:#088a8a;--teal-pale:#e6f9f9;--white:#fff;--body-bg:#f0f2f5;--card-bg:#fff;--border:#e2e6ed;--text:#1a1f2e;--text-mid:#4a5568;--text-light:#8a94a6;--amber:#f59e0b;--amber-pale:#fffbeb;--amber-border:#fde68a;--green:#10b981;--red:#ef4444;--red-pale:#fef2f2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--body-bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;line-height:1.5}

.back-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:30px;height:30px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s;font-family:'Inter',sans-serif}
.back-btn:hover{background:rgba(255,255,255,.2)}
/* TOPBAR */
.topbar{background:var(--navy);padding:0 24px;display:flex;align-items:center;gap:12px;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.25);position:sticky;top:0;z-index:50}
.topbar-icon{width:32px;height:32px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:700;color:#fff;white-space:nowrap}
.topbar-divider{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px;flex-shrink:0}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.5);white-space:nowrap}
.topbar-spacer{flex:1}

/* LAUNCH SWITCHER in topbar */
.launch-switcher{display:flex;align-items:center;gap:8px}
.launch-select-wrap{position:relative}
.launch-select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:5px 28px 5px 10px;border-radius:8px;cursor:pointer;appearance:none;outline:none;min-width:160px}
.launch-select option{background:var(--navy);color:#fff}
.launch-select-arrow{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:rgba(255,255,255,.6);font-size:10px}
.new-launch-btn{background:var(--teal);color:var(--navy);border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:background .12s}
.new-launch-btn:hover{background:#08aaaa}

/* PAGE */
.page{max-width:960px;margin:0 auto;padding:24px 20px 60px}

/* HERO */
.page-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;background:var(--navy);border-radius:14px;padding:24px 28px;margin-bottom:20px;flex-wrap:wrap}
.hero-left{display:flex;flex-direction:column;gap:4px}

/* SHOOT CARD */
.shoot-list{display:flex;flex-direction:column;gap:8px}
.shoot-item{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:#fafbfc;align-items:flex-start}
.shoot-date-block{flex-shrink:0;background:var(--navy);color:#fff;border-radius:8px;padding:6px 10px;text-align:center;min-width:52px}
.shoot-date-day{font-size:18px;font-weight:800;line-height:1}
.shoot-date-month{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-top:2px}
.shoot-details{flex:1}
.shoot-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.shoot-meta{font-size:11px;color:var(--text-light);display:flex;flex-wrap:wrap;gap:8px}
.shoot-meta span{display:flex;align-items:center;gap:3px}
.shoot-status{flex-shrink:0}
.status-pill{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;background:#f0f2f5;color:var(--text-mid)}
.status-pill.confirmed{background:#ecfdf5;color:#065f46}
.status-pill.planned{background:#eff6ff;color:#1e40af}
.status-pill.pending{background:var(--amber-pale);color:#92670a}
.shoot-link{font-size:10px;color:var(--teal);text-decoration:none;font-weight:600;flex-shrink:0;align-self:center}
.shoot-link:hover{text-decoration:underline}
.page-title{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.1}
.title-sub{font-size:14px;font-weight:500;color:rgba(255,255,255,.45);display:block;margin-top:3px}
.page-hero-date{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.hero-date-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.hero-date-main{font-size:28px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1}
.hero-time{display:flex;align-items:center;gap:7px;font-size:18px;font-weight:700;color:var(--teal);margin-top:2px}
.dot{width:8px;height:8px;background:var(--teal);border-radius:50%;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.hero-edit-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s;flex-shrink:0;align-self:flex-start}
.hero-edit-btn:hover{background:rgba(255,255,255,.2)}

/* CARDS */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
.card-header{padding:14px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card-icon{font-size:15px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-mid);flex:1}
.card-add-btn{background:var(--teal);color:#fff;border:none;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s}
.card-add-btn:hover{background:var(--teal-dim)}
.card-body{padding:16px 18px}

/* TIMELINE */
.timeline{display:flex;flex-direction:column}
.time-block{position:relative;padding-left:28px;padding-bottom:20px}
.time-block:last-child{padding-bottom:0}
.time-block::before{content:'';position:absolute;left:9px;top:26px;bottom:0;width:2px;background:var(--border)}
.time-block:last-child::before{display:none}
.time-block::after{content:'';position:absolute;left:4px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 2px var(--teal)}
.time-stamp{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:6px}
.task-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.task-item{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:6px;border:1px solid transparent;transition:border-color .12s,background .12s}
.task-item:hover{background:#f8f9fb;border-color:var(--border)}
.task-item:hover .item-actions{opacity:1}
.task-dot{flex-shrink:0;width:6px;height:6px;margin-top:5px;border-radius:50%;background:var(--teal)}
.task-text{flex:1;font-size:13px;color:var(--text);line-height:1.4}
.owner-pill{display:inline-flex;align-items:center;background:var(--teal-pale);color:var(--teal-dim);font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;margin-left:5px;white-space:nowrap;vertical-align:middle}

/* ITEM ACTIONS */
.item-actions{display:flex;gap:4px;margin-left:auto;flex-shrink:0;opacity:0;transition:opacity .12s}
.btn-edit{background:var(--teal-pale);color:var(--teal-dim);border:1px solid #b2e8e8;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn-edit:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-delete{background:#fef2f2;color:var(--red);border:1px solid #fecaca;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn-delete:hover{background:var(--red);color:#fff}

/* RESOURCES */
.resource-group{margin-bottom:16px}
.resource-group:last-child{margin-bottom:0}
.resource-group-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-light);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.not-live-badge{font-size:9px;font-weight:600;text-transform:none;letter-spacing:0;background:var(--amber-pale);color:#92670a;border:1px solid var(--amber-border);padding:1px 7px;border-radius:20px}
.link-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.link-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fafbfc;transition:border-color .12s}
.link-item:hover{border-color:var(--teal)}
.link-item:hover .item-actions{opacity:1}
.link-icon{flex-shrink:0;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;background:#edf0f5}
.link-icon.sp{background:#e8f0fe}.link-icon.ht{background:#fff0e8}.link-icon.ps{background:#e8f9f9}.link-icon.doc{background:#e8f0fe}
.link-label-text{flex:1;font-size:12.5px;font-weight:500;color:var(--text)}
.view-pill{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;background:var(--teal-pale);color:var(--teal-dim);border:1px solid #b2e8e8;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:600;text-decoration:none;transition:background .12s}
.view-pill:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.copy-btn{flex-shrink:0;background:var(--teal);border:none;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:600;color:#fff;cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s}
.copy-btn:hover{background:var(--teal-dim)}
.copy-btn.copied{background:var(--green)}

/* PRODUCTS */
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.product-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fafbfc;display:flex;flex-direction:column;position:relative}
.product-card:hover .product-card-actions{opacity:1}
.product-card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.product-img-wrap{aspect-ratio:1/1;overflow:hidden;background:#edf0f5}
.product-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.product-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;background:#f0f2f5;aspect-ratio:1/1}
.product-info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.product-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.4}
.product-copy-btn{width:100%;font-size:11px;font-weight:600;color:#fff;padding:6px 10px;border:none;border-radius:20px;background:var(--teal);cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s}
.product-copy-btn:hover{background:var(--teal-dim)}
.product-copy-btn.copied{background:var(--green)}

/* NOTES */
.note-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.note-item{display:flex;gap:10px;padding:10px 14px;background:var(--amber-pale);border:1px solid var(--amber-border);border-left:3px solid var(--amber);border-radius:8px;font-size:13px;line-height:1.5;position:relative}
.note-item:hover .item-actions{opacity:1}
.note-item.info{background:var(--teal-pale);border-color:#b2e8e8;border-left-color:var(--teal)}
.note-icon{flex-shrink:0;font-size:14px;margin-top:1px}
.note-text{flex:1}

/* EMPTY */
.empty-state{text-align:center;padding:24px;color:var(--text-light);font-size:12px;border:1.5px dashed var(--border);border-radius:8px}

/* WELCOME SCREEN */
.welcome{text-align:center;padding:60px 20px}
.welcome h2{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:12px}
.welcome p{color:var(--text-mid);margin-bottom:24px;max-width:420px;margin-left:auto;margin-right:auto}
.welcome-btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s}
.welcome-btn:hover{background:var(--teal-dim)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.2);position:relative;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:18px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-light)}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:600;color:var(--text-mid);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block}
.form-input,.form-textarea,.form-select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);background:#fff;outline:none;transition:border-color .12s}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--teal)}
.form-textarea{resize:vertical;min-height:80px}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.btn-primary{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s}
.btn-primary:hover{background:var(--teal-dim)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:#f0f2f5;color:var(--text-mid);border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn-danger{background:var(--red-pale);color:var(--red);border:1px solid #fecaca;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-right:auto}
.btn-danger:hover{background:var(--red);color:#fff}

/* TOAST */
.saving-toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:600;z-index:300;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
.saving-toast.show{opacity:1;transform:translateY(0)}
.saving-toast.success{background:var(--green)}
.saving-toast.error{background:var(--red)}

/* LOADING */
.loading-state{text-align:center;padding:60px 20px;color:var(--text-light)}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* FOOTER */
.page-footer{max-width:960px;margin:0 auto;padding:0 20px 32px;text-align:center;font-size:11px;color:var(--text-light)}
.monday-badge{display:inline-flex;align-items:center;gap:5px;margin-top:4px}
.monday-dot{width:6px;height:6px;background:#6161ff;border-radius:50%}

.task-item.shoot-entry{background:#f0f9f9;border:1px solid #b2e8e8}
.task-item.shoot-entry:hover{background:#e6f9f9;border-color:var(--teal)}
.shoot-dot{flex-shrink:0;width:18px;height:18px;margin-top:0;border-radius:50%;background:var(--teal-pale);border:1.5px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:10px}
.shoot-tag{display:inline-flex;align-items:center;background:var(--teal);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;margin-left:6px;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}.page-hero{flex-direction:column;align-items:flex-start}.page-hero-date{text-align:left;align-items:flex-start}.launch-select{min-width:120px}}

/* TAB BAR */
.tab-bar{background:#fff;border-bottom:1px solid var(--border);display:flex;padding:0 24px}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:12px 18px;font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;font-family:'Inter',sans-serif;transition:color .12s,border-color .12s;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal)}

/* TASKS */
.tasks-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.tasks-title{font-size:18px;font-weight:800;color:var(--navy);flex:1}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:12px 16px;background:#fff;border:1px solid var(--border);border-radius:10px}
.filter-label{font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.filter-select{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;color:var(--text);background:#fff;outline:none;cursor:pointer;transition:border-color .12s}
.filter-select:focus{border-color:var(--teal)}
.filter-spacer{flex:1}
.filter-clear{background:none;border:none;font-size:11px;color:var(--text-light);cursor:pointer;font-family:'Inter',sans-serif;text-decoration:underline;padding:0}
.filter-clear:hover{color:var(--text)}
.add-task-btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:background .12s}
.add-task-btn:hover{background:var(--teal-dim)}
.tasks-list{display:flex;flex-direction:column;gap:8px}
.task-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;transition:border-color .12s,box-shadow .12s}
.task-card:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(10,191,191,.08)}
.task-card:hover .item-actions{opacity:1}
.task-card.completed{opacity:.6}
.task-card.completed .task-card-name{text-decoration:line-through;color:var(--text-light)}
.task-status-btn{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;margin-top:1px}
.task-status-btn.in-progress{border-color:var(--amber);background:var(--amber-pale)}
.task-status-btn.completed{border-color:var(--green);background:var(--green-pale)}
.task-card-body{flex:1;min-width:0}
.task-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.task-card-name{font-size:13px;font-weight:600;color:var(--text)}
.dept-pill{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.dept-pill.ecommerce{background:#ede9fe;color:#5b21b6}
.dept-pill.logistics{background:#fef3c7;color:#92400e}
.dept-pill.data-entry{background:#e0f2fe;color:#075985}
.dept-pill.marketing{background:#fce7f3;color:#9d174d}
.dept-pill.custom{background:#f0fdf4;color:#166534}
.dept-pill.default{background:#f0f2f5;color:var(--text-mid)}
.task-card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text-light);margin-top:4px}
.task-due.overdue{color:var(--red);font-weight:600}
.task-due.today{color:var(--amber);font-weight:600}
.task-details-text{font-size:11.5px;color:var(--text-mid);margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.assignee-dropdown{position:relative}
.assignee-dropdown-trigger{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);background:#fff;outline:none;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;transition:border-color .12s}
.assignee-dropdown-trigger:focus,.assignee-dropdown-trigger.open{border-color:var(--teal)}
.assignee-dropdown-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--teal);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;max-height:220px;overflow-y:auto}
.assignee-option{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;transition:background .1s;font-size:13px;color:var(--text)}
.assignee-option:hover{background:var(--teal-pale)}
.assignee-option input[type=checkbox]{width:14px;height:14px;accent-color:var(--teal);flex-shrink:0;cursor:pointer}
.assignee-option .assignee-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0}

.task-count{font-size:10px;font-weight:700;background:var(--teal);color:#fff;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;display:inline-block}

.manage-dept-btn{background:#f0f2f5;color:var(--text-mid);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .12s;white-space:nowrap}
.manage-dept-btn:hover{background:var(--border)}
.completed-date{font-size:11px;color:var(--green);display:flex;align-items:center;gap:3px}

.dept-header .dept-count{font-size:10px;font-weight:700;background:var(--border);color:var(--text-mid);padding:1px 7px;border-radius:20px}
.dept-section{margin-bottom:20px}

<body>

  <button class="back-btn" onclick="goHome()" title="Back to Home">←</button>
  <div class="topbar-icon">⚡</div>
  <span class="topbar-title">Launch Hub</span>
  <div class="topbar-divider"></div>
  <span class="topbar-sub">Port Adelaide FC</span>
  <div class="topbar-spacer"></div>
  <div class="launch-switcher">
    <div class="launch-select-wrap">
      <select class="launch-select" id="launch-select" onchange="switchLaunch(this.value)">
        <option value="">Loading...</option>
      </select>
      <span class="launch-select-arrow">▾</span>

<div class="page">

<!-- TASKS VIEW -->
<div class="page" id="tasks-view" style="display:none">
  <div class="tasks-header">
    <span class="tasks-title" id="tasks-title">Tasks</span>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="view-toggle">
        <button class="view-toggle-btn active" id="toggle-date" onclick="setTaskView('date')">📅 By Date</button>
        <button class="view-toggle-btn" id="toggle-dept" onclick="setTaskView('dept')">🏷️ By Department</button>
      </div>
      <button class="manage-dept-btn" onclick="manageDepartments()">⚙️ Departments</button>

  </div>

    <span class="filter-label">Filter by</span>
    <select class="filter-select" id="filter-status" onchange="renderTasks()">
      <option value="">All Statuses</option>

      <option value="In Progress">In Progress</option>

      <option value="">All Assignees</option>

</div>

<div class="page-footer">
  Port Adelaide Football Club · Retail &amp; Merchandise
  <div class="monday-badge"><span class="monday-dot"></span> Powered by Monday.com</div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<div class="saving-toast" id="toast"></div>

<script src="config.js"></script>
<script>
// ── MONDAY SDK ──
const mondaySDK = window.monday || null;
let currentUserId = null;

async function initSDK() {
  if (!mondaySDK) return;
  try {
    mondaySDK.setToken(LAUNCH_HUB_CONFIG.MONDAY_TOKEN);
    const ctx = await mondaySDK.get('context');
    currentUserId = String(ctx?.data?.user?.id || '');
  } catch(e) { console.warn('SDK context unavailable:', e); }
}

function goHome() {
  window.location.href = 'index.html';
}

const API = 'https://api.monday.com/v2';
const TOKEN = LAUNCH_HUB_CONFIG.MONDAY_TOKEN;
const BOARD_ID = LAUNCH_HUB_CONFIG.BOARD_ID;
const SHOOT_BOARD_ID = LAUNCH_HUB_CONFIG.SHOOT_BOARD_ID;
const GROUPS = LAUNCH_HUB_CONFIG.GROUPS;
const COLS = LAUNCH_HUB_CONFIG.COLUMNS;
const SCOLS = LAUNCH_HUB_CONFIG.SHOOT_COLS;

// ── STATE ──
let allItems = [];
let allShoots = [];
let allUsers = [];
let launches = [];
let departments = [];      // live from Config group
let currentLaunch = null;
let linkedShootIds = [];
let currentTab = 'hub';
let taskViewMode = 'date'; // 'date' or 'dept'
let state = { launch: null, timeline: [], resources: [], products: [], notes: [], tasks: [] };

// PAFC users list (pre-loaded for performance)
const PAFC_USERS = [
  {"id":"82646896","name":"Georgie Morris","photo":"https://files.monday.com/use1/photos/82646896/thumb/82646896-user_photo_initials_2025_09_09_04_39_35.png?1757392775"},
  {"id":"46104905","name":"Mike Hawkins","photo":"https://files.monday.com/use1/photos/46104905/thumb/46104905-user_photo_initials_2023_07_25_06_31_13.png?1690266673"},
  {"id":"35080765","name":"Steve Frank","photo":"https://files.monday.com/use1/photos/35080765/thumb/35080765-user_photo_initials_2022_09_27_06_29_54.png?1664260194"},
  {"id":"102504354","name":"Samuel Gorgone","photo":"https://files.monday.com/use1/photos/102504354/thumb/102504354-user_photo_initials_2026_06_01_01_11_36.png?1780276296"},
  {"id":"44397410","name":"Simon Buckley","photo":"https://files.monday.com/use1/photos/44397410/thumb/44397410-user_photo_initials_2023_06_13_04_53_20.png?1686632000"},
  {"id":"29892421","name":"Andrew Fuss","photo":"https://files.monday.com/use1/photos/29892421/thumb/29892421-user_photo_initials_2022_04_22_01_04_59.png?1650589499"},
  {"id":"33551309","name":"Ruby McHaffie","photo":"https://files.monday.com/use1/photos/33551309/thumb/33551309-user_photo_2023_04_18_05_41_20.png?1681796480"},
  {"id":"51529712","name":"Matthew Richardson","photo":"https://files.monday.com/use1/photos/51529712/thumb/51529712-user_photo_initials_2023_11_08_05_10_47.png?1699420247"},
  {"id":"27582813","name":"Isabel Gawel","photo":"https://files.monday.com/use1/photos/27582813/thumb/27582813-user_photo_initials_2022_01_31_23_09_17.png?1643670557"},
  {"id":"102823072","name":"Tessa Briscoe","photo":"https://files.monday.com/use1/photos/102823072/thumb/102823072-user_photo_initials_2026_04_28_02_56_09.png?1777344969"},
  {"id":"70608708","name":"Jarrod Pettit","photo":"https://files.monday.com/use1/photos/70608708/thumb/70608708-user_photo_initials_2025_01_14_03_21_48.png?1736824908"}
];

// ── API ──
async function mondayQuery(query) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN, 'API-Version': '2024-01' },
    body: JSON.stringify({ query })
  });
  const d = await res.json();
  if (d.errors) throw new Error(d.errors[0].message);
  return d.data;
}

async function createItem(groupId, name, colVals) {
  const vals = JSON.stringify(JSON.stringify(colVals));
  const q = `mutation { create_item(board_id: ${BOARD_ID}, group_id: "${groupId}", item_name: ${JSON.stringify(name)}, column_values: ${vals}) { id name group { id } column_values { id value text } } }`;
  return (await mondayQuery(q)).create_item;
}

async function updateItem(itemId, colVals) {
  const vals = JSON.stringify(JSON.stringify(colVals));
  const q = `mutation { change_multiple_column_values(board_id: ${BOARD_ID}, item_id: ${itemId}, column_values: ${vals}) { id name group { id } column_values { id value text } } }`;
  return (await mondayQuery(q)).change_multiple_column_values;
}

async function updateName(itemId, name) {
  await mondayQuery(`mutation { change_item_name(board_id: ${BOARD_ID}, item_id: ${itemId}, value: ${JSON.stringify(name)}) { id } }`);
}

async function deleteItem(itemId) {
  await mondayQuery(`mutation { delete_item(item_id: ${itemId}) { id } }`);
}

// ── HELPERS ──
function getCol(item, colId) {
  const col = item.column_values?.find(c => c.id === colId);
  if (!col || !col.value || col.value === 'null') return '';
  try {
    const p = JSON.parse(col.value);
    if (p === null) return '';
    if (colId === COLS.URL || colId === COLS.BIGCOMMERCE_URL) return p.url || '';
    if (colId === COLS.NOTES) return p.text || '';
    if (colId === COLS.LAUNCH_DATE) return p.date || '';
    if (colId === COLS.SEVERITY) return p.label || col.text || '';
    return col.text || '';
  } catch { return col.text || ''; }
}

function formatDate(d) {
  if (!d) return '-';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
}

function getLinkIcon(url) {
  if (!url) return { cls: '', emoji: '🔗' };
  if (url.includes('sharepoint')) return { cls: 'sp', emoji: '📁' };
  if (url.includes('hightail'))   return { cls: 'ht', emoji: '📷' };
  if (url.includes('portstore'))  return { cls: 'ps', emoji: '🏬' };
  if (url.includes('.docx') || url.includes('docs')) return { cls: 'doc', emoji: '📄' };
  return { cls: '', emoji: '🔗' };
}

function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'saving-toast show' + (type ? ' ' + type : '');
  setTimeout(() => { t.className = 'saving-toast'; }, 2500);
}

function copyLink(btn, url) {
  navigator.clipboard.writeText(url).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
  });
}

// ── MODAL ──
function openModal(title, body, actions) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOnOverlay(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

// ── LOAD ALL DATA ──
async function loadAll() {
  const [launchData, shootData] = await Promise.all([
    mondayQuery(`{ boards(ids: [${BOARD_ID}]) { items_page(limit: 500) { items { id name group { id } column_values { id value text } } } } }`),
    mondayQuery(`{ boards(ids: [${SHOOT_BOARD_ID}]) { items_page(limit: 200) { items { id name group { id } column_values { id value text } } } } }`)
  ]);
  allItems = launchData.boards[0].items_page.items;
  allShoots = shootData.boards[0].items_page.items.filter(i => i.group.id === LAUNCH_HUB_CONFIG.SHOOT_GROUPS.REQUESTS);

  // Load departments from Config group
  departments = allItems
    .filter(i => i.group.id === GROUPS.CONFIG && getCol(i, COLS.LAUNCH) === LAUNCH_HUB_CONFIG.CONFIG_TAG)
    .map(i => ({ id: i.id, name: i.name }))
    .sort((a,b) => a.name.localeCompare(b.name));

  const nameSet = new Set();
  allItems.forEach(item => {
    const l = getCol(item, COLS.LAUNCH);
    if (l && l !== LAUNCH_HUB_CONFIG.CONFIG_TAG) nameSet.add(l);
  });
  launches = Array.from(nameSet).sort();
}

// ── POPULATE SELECTOR ──
function populateSelector() {
  const sel = document.getElementById('launch-select');
  sel.innerHTML = launches.length
    ? launches.map(l => `<option value="${l}"${l === currentLaunch ? ' selected' : ''}>${l}</option>`).join('')
    : `<option value="">No launches yet</option>`;
}

// ── FILTER STATE FOR CURRENT LAUNCH ──
function filterState() {
  const items = allItems.filter(i =>
    getCol(i, COLS.LAUNCH) === currentLaunch &&
    i.group.id !== GROUPS.CONFIG
  );
  state.launch    = items.find(i => i.group.id === GROUPS.LAUNCH_INFO) || null;
  state.timeline  = items.filter(i => i.group.id === GROUPS.TIMELINE);
  state.resources = items.filter(i => i.group.id === GROUPS.RESOURCES);
  state.products  = items.filter(i => i.group.id === GROUPS.PRODUCTS);
  state.notes     = items.filter(i => i.group.id === GROUPS.NOTES);
  state.tasks     = items.filter(i => i.group.id === GROUPS.TASKS);
  if (state.launch) {
    try {
      const raw = getCol(state.launch, COLS.NOTES);
      const parsed = JSON.parse(raw);
      linkedShootIds = Array.isArray(parsed?.shootIds) ? parsed.shootIds : [];
    } catch { linkedShootIds = []; }
  } else { linkedShootIds = []; }
}

// ── SWITCH LAUNCH ──
function switchLaunch(name) {
  currentLaunch = name;
  filterState();
  render();
}

// ── CREATE NEW LAUNCH ──
function createNewLaunch() {
  openModal('Create New Launch',
    `<div class="form-group"><label class="form-label">Launch Name</label><input class="form-input" id="f-new-launch" placeholder="e.g. SDNR 2026" autofocus></div>
     <div class="form-group"><label class="form-label">Launch Date</label><input class="form-input" id="f-new-date" type="date"></div>
     <div class="form-group"><label class="form-label">Launch Time</label><input class="form-input" id="f-new-time" placeholder="e.g. 10:00am"></div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn-primary" onclick="saveNewLaunch()">Create Launch</button>`);
  setTimeout(() => document.getElementById('f-new-launch')?.focus(), 50);
}

async function saveNewLaunch() {
  const name = document.getElementById('f-new-launch').value.trim();
  const date = document.getElementById('f-new-date').value;
  const time = document.getElementById('f-new-time').value.trim();
  if (!name) { alert('Launch name is required'); return; }
  if (launches.includes(name)) { alert('A launch with this name already exists'); return; }
  const btn = document.querySelector('#modal-actions .btn-primary');
  btn.disabled = true; btn.textContent = 'Creating...';
  try {
    const colVals = {
      [COLS.LAUNCH]: name,
      [COLS.LAUNCH_DATE]: date ? { date } : null,
      [COLS.LAUNCH_TIME]: time
    };
    const created = await createItem(GROUPS.LAUNCH_INFO, name, colVals);
    allItems.push(created);
    launches.push(name);
    launches.sort();
    currentLaunch = name;
    filterState();
    populateSelector();
    render();
    closeModal();
    toast('Launch created!', 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); btn.disabled = false; btn.textContent = 'Create Launch'; }
}

// ── RENDER ──
function render() {
  document.getElementById('hero-edit-btn').style.display = currentLaunch ? '' : 'none';

  // Update task tab badge
  const taskCount = state.tasks.filter(t => getTaskStatus(t) !== 'Completed').length;
  document.getElementById('tab-tasks').innerHTML = `🗂️ Tasks${taskCount ? ` <span class="task-count">${taskCount}</span>` : ''}`;

  // If on tasks tab, just re-render tasks
  if (currentTab === 'tasks') { renderTasks(); return; }

  if (!currentLaunch) {
    document.getElementById('hero-title').textContent = 'Launch Hub';
    document.getElementById('hero-date').textContent = '-';
    document.getElementById('hero-time').textContent = '-';
    document.getElementById('content').innerHTML = `
      <div class="welcome">
        <h2>No launches yet</h2>
        <p>Create your first launch to get started. You can add the timeline, resources, products and notes from here.</p>
        <button class="welcome-btn" onclick="createNewLaunch()">+ Create First Launch</button>
      </div>`;
    return;
  }

  if (state.launch) {
    const date = getCol(state.launch, COLS.LAUNCH_DATE);
    const time = getCol(state.launch, COLS.LAUNCH_TIME);
    document.getElementById('hero-title').textContent = state.launch.name;
    document.getElementById('hero-date').textContent = formatDate(date);
    document.getElementById('hero-time').textContent = time || '-';
    document.title = state.launch.name + ' - Launch Hub | PAFC';
  } else {
    document.getElementById('hero-title').textContent = currentLaunch;
    document.getElementById('hero-date').textContent = 'Set launch date';
    document.getElementById('hero-time').textContent = '-';
  }

  document.getElementById('content').innerHTML =
    renderTimeline() + renderShoots() + renderResources() + renderProducts() + renderNotes();
}

// ── RENDER SECTIONS ──
function renderTimeline() {
  const items = state.timeline;

  // Build combined list: regular tasks + shoot entries
  const linkedShoots = allShoots.filter(s => linkedShootIds.includes(s.id));
  const shootEntries = linkedShoots.map(s => ({
    _isShoot: true,
    id: s.id,
    name: s.name,
    _date: getShootCol(s, SCOLS.DATE) || '',
    _players: getShootCol(s, SCOLS.PLAYERS) || '',
    _location: getShootCol(s, SCOLS.LOCATION) || '',
    _status: getShootCol(s, SCOLS.STATUS) || ''
  }));

  // Sort regular tasks by date then time
  const sortedTasks = [...items].sort((a, b) => {
    const dateA = getCol(a, COLS.TIMELINE_DATE) || '9999-99-99';
    const dateB = getCol(b, COLS.TIMELINE_DATE) || '9999-99-99';
    if (dateA !== dateB) return dateA.localeCompare(dateB);
    const parseT = s => { const m = (s||'').match(/(\d+):(\d+)/); return m ? +m[1]*60 + +m[2] : 9999; };
    return parseT(getCol(a, COLS.LAUNCH_TIME)) - parseT(getCol(b, COLS.LAUNCH_TIME));
  });

  // Merge shoots into the sorted list grouped by date
  const byDate = {};
  sortedTasks.forEach(item => {
    const d = getCol(item, COLS.TIMELINE_DATE) || 'No date set';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push({ ...item, _isShoot: false });
  });
  shootEntries.forEach(shoot => {
    const d = shoot._date || 'No date set';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(shoot);
  });

  // Sort date keys chronologically
  const sortedDates = Object.keys(byDate).sort((a, b) => {
    if (a === 'No date set') return 1;
    if (b === 'No date set') return -1;
    return a.localeCompare(b);
  });

  const blocksHTML = sortedDates.length ? sortedDates.map(date => `
    <div class="time-block">
      <div class="time-stamp">${date !== 'No date set' ? formatDate(date) : 'No date set'}</div>
      <ul class="task-list">
        ${byDate[date].map(item => {
          if (item._isShoot) {
            const meta = [item._players, item._location].filter(Boolean).join(' - ');
            return `<li class="task-item shoot-entry">
              <span class="shoot-dot">📸</span>
              <span class="task-text">
                <strong>${item.name}</strong>
                <span class="shoot-tag">Shoot</span>
                ${meta ? `<span style="color:var(--text-mid);font-size:11px;display:block;margin-top:2px">${meta}</span>` : ''}
              </span>
              <a href="https://pafc-team.monday.com/boards/18412284375/views/256804294" target="_blank" style="color:var(--teal);font-size:10px;font-weight:600;text-decoration:none;flex-shrink:0;align-self:center">View ↗</a>
            </li>`;
          }
          const time  = getCol(item, COLS.LAUNCH_TIME);
          const owner = getCol(item, COLS.OWNER);
          const note  = getCol(item, COLS.NOTES);
          const owners = owner ? owner.split('/').map(o => `<span class="owner-pill">${o.trim()}</span>`).join('') : '';
          return `<li class="task-item">
            <span class="task-dot"></span>
            <span class="task-text">${time ? `<strong style="color:var(--teal-dim);margin-right:5px">${time}</strong>` : ''}${item.name}${note ? `<span style="color:var(--text-light);font-size:11px"> - ${note}</span>` : ''}${owners}</span>
            <div class="item-actions">

function renderShoots() {
  const linked = allShoots.filter(s => linkedShootIds.includes(s.id));
  const sorted = [...linked].sort((a,b) => {

    const db = getShootCol(b, SCOLS.DATE) || '9999';
    return da.localeCompare(db);
  });

  function statusClass(s) {
    if (!s) return '';
    const sl = s.toLowerCase();
    if (sl.includes('confirm')) return 'confirmed';
    if (sl.includes('plan') || sl.includes('approv')) return 'planned';
    return 'pending';
  }

  const shootsHTML = sorted.length ? sorted.map(shoot => {
    const date     = getShootCol(shoot, SCOLS.DATE);
    const players  = getShootCol(shoot, SCOLS.PLAYERS);
    const location = getShootCol(shoot, SCOLS.LOCATION);
    const status   = getShootCol(shoot, SCOLS.STATUS);
    const d = date ? new Date(date + 'T00:00:00') : null;
    return `<div class="shoot-item">
      ${d ? `<div class="shoot-date-block">
        <div class="shoot-date-day">${d.getDate()}</div>
        <div class="shoot-date-month">${d.toLocaleDateString('en-AU',{month:'short'})}</div>
      </div>` : ''}
      <div class="shoot-details">
        <div class="shoot-name">${shoot.name}</div>
        <div class="shoot-meta">
          ${players  ? `<span>👤 ${players}</span>` : ''}
          ${location ? `<span>📍 ${location}</span>` : ''}
          ${d ? `<span>📅 ${d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}</span>` : ''}
        </div>
      </div>
      <div class="shoot-status">
        ${status ? `<span class="status-pill ${statusClass(status)}">${status}</span>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
        <a href="https://pafc-team.monday.com/boards/18412284375/views/256804294" target="_blank" class="shoot-link">View in ASA Hub ↗</a>

      <span class="card-icon">📸</span>
      <span class="card-title">Photoshoots</span>
      <button class="card-add-btn" onclick="openShootPicker()">+ Link Shoot</button>

    </div>
  </div>`;
}

function getShootCol(item, colId) {
  const col = item.column_values?.find(c => c.id === colId);
  if (!col || !col.value || col.value === 'null') return '';
  try {
    const p = JSON.parse(col.value);
    if (p === null) return '';
    if (colId === SCOLS.DATE) return p.date || '';
    if (colId === SCOLS.NOTES) return p.text || '';
    if (colId === SCOLS.STATUS) return p.label || col.text || '';
    return col.text || '';
  } catch { return col.text || ''; }
}

function openShootPicker() {
  const available = allShoots.filter(s => !linkedShootIds.includes(s.id));
  const optionsHTML = available.length

function openHeroEdit() {
  const l = state.launch;
  const name = l ? l.name : currentLaunch;

  const time = l ? getCol(l, COLS.LAUNCH_TIME) : '';
  openModal('Edit Launch Info',
    `<div class="form-group"><label class="form-label">Launch Name</label><input class="form-input" id="f-ln" value="${name}" placeholder="e.g. Prison Bar 2026"></div>
     <div class="form-group"><label class="form-label">Launch Date</label><input class="form-input" id="f-ld" type="date" value="${date}"></div>
     <div class="form-group"><label class="form-label">Launch Time</label><input class="form-input" id="f-lt" value="${time}" placeholder="e.g. 10:00am"></div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn-primary" onclick="saveHeroEdit()">Save</button>`);
}

async function saveHeroEdit() {
  const name = document.getElementById('f-ln').value.trim();
  const date = document.getElementById('f-ld').value;
  const time = document.getElementById('f-lt').value.trim();
  if (!name) { alert('Launch name is required'); return; }
  const btn = document.querySelector('#modal-actions .btn-primary');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    const colVals = { [COLS.LAUNCH]: name, [COLS.LAUNCH_DATE]: date ? { date } : null, [COLS.LAUNCH_TIME]: time };
    if (state.launch) {
      const updated = await updateItem(state.launch.id, colVals);
      if (name !== state.launch.name) await updateName(state.launch.id, name);
      // update allItems
      const idx = allItems.findIndex(i => i.id === state.launch.id);
      if (idx > -1) allItems[idx] = { ...allItems[idx], name, column_values: updated.column_values };
    } else {
      const created = await createItem(GROUPS.LAUNCH_INFO, name, colVals);
      allItems.push(created);
    }
    // handle launch name change
    if (name !== currentLaunch) {
      // retag all items for this launch
      const toRetag = allItems.filter(i => getCol(i, COLS.LAUNCH) === currentLaunch && i.group.id !== GROUPS.LAUNCH_INFO);
      await Promise.all(toRetag.map(i => updateItem(i.id, { [COLS.LAUNCH]: name })));
      toRetag.forEach(i => { const cv = i.column_values.find(c => c.id === COLS.LAUNCH); if(cv) cv.text = name; });
      launches = launches.filter(l => l !== currentLaunch);
      if (!launches.includes(name)) launches.push(name);
      launches.sort();
      currentLaunch = name;
      populateSelector();
    }
    filterState(); render(); closeModal(); toast('Launch info saved', 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); btn.disabled = false; btn.textContent = 'Save'; }
}

// ── SAVE HELPERS ──
async function saveItem(id, section, groupId, name, colVals) {
  const allCols = { ...colVals, [COLS.LAUNCH]: currentLaunch };
  if (id) {
    const updated = await updateItem(id, allCols);
    const item = state[section].find(i => i.id === id);
    if (name !== item.name) await updateName(id, name);
    item.name = name; item.column_values = updated.column_values;
    const gi = allItems.findIndex(i => i.id === id);
    if (gi > -1) { allItems[gi].name = name; allItems[gi].column_values = updated.column_values; }
  } else {
    const created = await createItem(groupId, name, allCols);
    state[section].push(created);
    allItems.push(created);
  }
}

// ── TASKS HELPERS ──
// Monday Task Status column — use index numbers (more reliable than label text)
// 0 = Working on it (Assigned), 1 = Done (In Progress), 2 = Stuck (Completed)
const STATUS_TO_INDEX = { 'Assigned': 0, 'In Progress': 1, 'Completed': 2 };
const INDEX_TO_STATUS = { 0: 'Assigned', 1: 'In Progress', 2: 'Completed' };

function getTaskStatus(item) {
  const col = item.column_values?.find(c => c.id === COLS.TASK_STATUS);
  if (!col || !col.value || col.value === 'null') return 'Assigned';
  try {
    const p = JSON.parse(col.value);
    if (p === null) return 'Assigned';
    // Monday returns index as a number
    const idx = p.index;
    if (idx !== undefined && INDEX_TO_STATUS[idx] !== undefined) return INDEX_TO_STATUS[idx];
    // Fallback: match by label text
    const label = p?.label || col.text || '';
    if (label === 'Working on it') return 'Assigned';
    if (label === 'Done') return 'In Progress';
    if (label === 'Stuck') return 'Completed';
    return 'Assigned';
  } catch { return 'Assigned'; }
}

function statusColVal(displayStatus) {
  const idx = STATUS_TO_INDEX[displayStatus] ?? 0;
  return { index: idx };
}

function getTaskAssigneeIds(item) {
  const col = item.column_values?.find(c => c.id === COLS.TASK_ASSIGNEE);
  if (!col || !col.value || col.value === 'null') return [];
  try {
    const p = JSON.parse(col.value);
    return (p.personsAndTeams || []).filter(x => x.kind === 'person').map(x => String(x.id));
  } catch { return []; }
}

function getUserById(id) {
  return PAFC_USERS.find(u => u.id === String(id)) || null;
}

function getDeptClass(dept) {
  if (!dept) return 'default';
  // Static colour map for known departments, fallback for custom ones
  const map = { 'Ecommerce':'ecommerce','Logistics':'logistics','Data Entry':'data-entry','Marketing':'marketing','Custom':'custom' };
  return map[dept] || 'default';
}

function setTaskView(mode) {
  taskViewMode = mode;
  document.getElementById('toggle-date').classList.toggle('active', mode === 'date');
  document.getElementById('toggle-dept').classList.toggle('active', mode === 'dept');
  renderTasks();
}

function formatDueDate(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dateStr + 'T00:00:00');
  const diff = Math.round((due - today) / 86400000);
  const formatted = due.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  if (diff < 0) return { text: `Overdue - ${formatted}`, cls: 'overdue' };
  if (diff === 0) return { text: 'Due today', cls: 'today' };
  if (diff === 1) return { text: 'Due tomorrow', cls: '' };
  return { text: `Due ${formatted}`, cls: '' };
}

function populateFilters() {
  // Dept filter from live departments
  const deptSel = document.getElementById('filter-dept');
  if (deptSel) {
    const currentDept = deptSel.value;
    deptSel.innerHTML = '<option value="">All Departments</option>' +
      departments.map(d => `<option value="${d.name}" ${d.name === currentDept ? 'selected' : ''}>${d.name}</option>`).join('');

  const sel = document.getElementById('filter-assignee');
  if (!sel) return;
  const usedIds = new Set(state.tasks.flatMap(t => getTaskAssigneeIds(t)));
  const current = sel.value;
  sel.innerHTML = '<option value="">All Assignees</option>' +
    PAFC_USERS.filter(u => usedIds.has(u.id)).map(u => `<option value="${u.id}" ${u.id === current ? 'selected' : ''}>${u.name}</option>`).join('');
}

// ── RENDER TASKS ──
function renderTasks() {
  if (!currentLaunch) {
    document.getElementById('tasks-content').innerHTML = `<div class="tasks-empty"><h3>No launch selected</h3><p>Select or create a launch first</p></div>`;
    return;
  }

  document.getElementById('tasks-title').textContent = `Tasks - ${currentLaunch}`;
  populateFilters();

  const filterStatus   = document.getElementById('filter-status')?.value || '';
  const filterDept     = document.getElementById('filter-dept')?.value || '';
  const filterAssignee = document.getElementById('filter-assignee')?.value || '';

  let tasks = [...state.tasks];
  if (filterStatus)   tasks = tasks.filter(t => getTaskStatus(t) === filterStatus);
  if (filterDept)     tasks = tasks.filter(t => getCol(t, COLS.TASK_DEPT) === filterDept);
  if (filterAssignee) tasks = tasks.filter(t => getTaskAssigneeIds(t).includes(filterAssignee));

  if (!tasks.length) {
    const hasFilters = filterStatus || filterDept || filterAssignee;
    document.getElementById('tasks-content').innerHTML = `<div class="tasks-empty"><h3>${hasFilters ? 'No tasks match your filters' : 'No tasks yet'}</h3><p>${hasFilters ? 'Try clearing your filters' : 'Add your first task using the button above'}</p></div>`;
    return;
  }

  const sortByDate = (a, b) => (getCol(a, COLS.TASK_DUE) || '9999').localeCompare(getCol(b, COLS.TASK_DUE) || '9999');
  const incomplete = tasks.filter(t => getTaskStatus(t) !== 'Completed').sort(sortByDate);
  const completed  = tasks.filter(t => getTaskStatus(t) === 'Completed').sort(sortByDate);

  let html = '';

  if (taskViewMode === 'date') {
    // Group by due date
    const byDate = {};
    incomplete.forEach(t => {
      const d = getCol(t, COLS.TASK_DUE) || 'No due date';
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push(t);
    });
    const dateKeys = Object.keys(byDate).sort((a,b) => a === 'No due date' ? 1 : b === 'No due date' ? -1 : a.localeCompare(b));
    dateKeys.forEach(d => {
      const label = d === 'No due date' ? 'No due date' : new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
      html += `<div class="dept-section"><div class="dept-header">📅 ${label} <span class="dept-count">${byDate[d].length}</span></div><div class="tasks-list">${byDate[d].map(taskCardHTML).join('')}</div></div>`;
    });
  } else {
    // Group by department
    const byDept = {};
    incomplete.forEach(t => {
      const d = getCol(t, COLS.TASK_DEPT) || 'No Department';
      if (!byDept[d]) byDept[d] = [];
      byDept[d].push(t);
    });
    const deptOrder = departments.map(d => d.name);
    const allDeptKeys = [...deptOrder.filter(d => byDept[d]), ...Object.keys(byDept).filter(d => !deptOrder.includes(d))];
    allDeptKeys.forEach(d => {
      if (!byDept[d]) return;
      html += `<div class="dept-section"><div class="dept-header">🏷️ ${d} <span class="dept-count">${byDept[d].length}</span></div><div class="tasks-list">${byDept[d].map(taskCardHTML).join('')}</div></div>`;
    });
  }

  if (completed.length) {
    html += `<div class="dept-section"><div class="dept-header" style="color:var(--green)">✓ Completed <span class="dept-count">${completed.length}</span></div><div class="tasks-list">${completed.map(taskCardHTML).join('')}</div></div>`;
  }

  document.getElementById('tasks-content').innerHTML = html || `<div class="tasks-empty"><h3>No tasks yet</h3><p>Add your first task using the button above</p></div>`;
}

function taskCardHTML(task) {
  const status   = getTaskStatus(task);
  const area     = getCol(task, COLS.TASK_DEPT);
  const due      = getCol(task, COLS.TASK_DUE);
  const details  = getCol(task, COLS.TASK_DETAILS);
  const assigneeIds = getTaskAssigneeIds(task);
  const assignees = assigneeIds.map(id => getUserById(id)).filter(Boolean);

  const statusIcon = status === 'Completed' ? '✓' : status === 'In Progress' ? '●' : '';
  const statusCls  = status === 'Completed' ? 'completed' : status === 'In Progress' ? 'in-progress' : '';
  const nextStatus = status === 'Assigned' ? 'In Progress' : status === 'In Progress' ? 'Completed' : 'Assigned';
  const nextLabel  = `Click to mark ${nextStatus}`;

  const dueInfo = due ? formatDueDate(due) : null;
  const completedDate = getCol(task, COLS.TASK_COMPLETED);
  const completedDateStr = completedDate ? new Date(completedDate + 'T00:00:00').toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : null;

  const assigneeHTML = assignees.length ? `
    <div class="assignee-wrap">
      ${assignees.map(u => `<img class="assignee-avatar" src="${u.photo}" alt="${u.name}" title="${u.name}" onerror="this.style.display='none'">`).join('')}
      <span style="font-size:11px;color:var(--text-mid)">${assignees.map(u => u.name.split(' ')[0]).join(', ')}</span>
    </div>` : '';

  const detailsHTML = details ? `<div class="task-details-text">${details.replace(/https?:\/\/[^\s]+/g, url => `<a href="${url}" target="_blank">${url}</a>`)}</div>` : '';

  return `<div class="task-card ${status === 'Completed' ? 'completed' : ''}">
    <button class="task-status-btn ${statusCls}" onclick="cycleTaskStatus('${task.id}')" title="${nextLabel}">${statusIcon}</button>
    <div class="task-card-body">
      <div class="task-card-top">
        <span class="task-card-name">${task.name}</span>
        ${area ? `<span class="dept-pill ${getDeptClass(area)}">${area}</span>` : ''}
      </div>
      <div class="task-card-meta">
        ${dueInfo ? `<span class="task-due ${dueInfo.cls}">📅 ${dueInfo.text}</span>` : ''}
        ${completedDateStr ? `<span class="completed-date">✓ Completed ${completedDateStr}</span>` : ''}
        ${assigneeHTML}
      </div>
      ${detailsHTML}
    </div>
    <div class="item-actions">
      <button class="btn-edit" onclick="editTaskItem('${task.id}')">Edit</button>
      <button class="btn-delete" onclick="confirmDelete('${task.id}','tasks','${task.name.replace(/'/g,"\\'")}')">Delete</button>
    </div>
  </div>`;
}

// ── CYCLE STATUS ──
async function cycleTaskStatus(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  const current = getTaskStatus(task);
  const next = current === 'Assigned' ? 'In Progress' : current === 'In Progress' ? 'Completed' : 'Assigned';

  // If cycling to Completed, prompt for completed date
  if (next === 'Completed') {
    const today = new Date().toISOString().split('T')[0];
    openModal('Mark as Completed',
      `<p style="color:var(--text-mid);margin-bottom:16px;font-size:13px">Optionally set a completed date for <strong>${task.name}</strong>.</p>
       <div class="form-group"><label class="form-label">Completed Date</label><input class="form-input" id="f-completed-date" type="date" value="${today}"></div>`,
      `<button class="btn-secondary" onclick="doMarkComplete('${id}', '')">Skip Date</button>
       <button class="btn-primary" onclick="doMarkComplete('${id}', document.getElementById('f-completed-date').value)">Mark Completed</button>`);
    return;
  }

  try {
    const colVals = { [COLS.TASK_STATUS]: statusColVal(next) };
    // If cycling back from Completed, clear the completed date
    if (current === 'Completed') colVals[COLS.TASK_COMPLETED] = null;
    const updated = await updateItem(id, colVals);
    task.column_values = updated.column_values;
    const gi = allItems.findIndex(i => i.id === id);
    if (gi > -1) allItems[gi].column_values = updated.column_values;
    renderTasks(); toast(`Marked ${next}`, 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function doMarkComplete(id, completedDate) {
  const btn = document.querySelector('#modal-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  try {
    const colVals = {
      [COLS.TASK_STATUS]: statusColVal('Completed'),
      [COLS.TASK_COMPLETED]: completedDate ? { date: completedDate } : null
    };
    const updated = await updateItem(id, colVals);
    const task = state.tasks.find(t => t.id === id);
    if (task) task.column_values = updated.column_values;
    const gi = allItems.findIndex(i => i.id === id);
    if (gi > -1) allItems[gi].column_values = updated.column_values;
    renderTasks(); closeModal(); toast('Marked Completed', 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Mark Completed'; } }
}

async function saveTaskItem(id) {
  const name     = document.getElementById('f-tk-name').value.trim();
  const dept     = document.getElementById('f-tk-dept').value;
  const due      = document.getElementById('f-tk-due').value;
  const details  = document.getElementById('f-tk-details').value.trim();
  const statusEl = document.getElementById('f-tk-status');
  const status   = statusEl ? statusEl.value : 'Assigned';
  const completedEl = document.getElementById('f-tk-completed');
  const completedDate = completedEl ? completedEl.value : '';

  // Get selected assignees from checkboxes
  const selectedIds = Array.from(document.querySelectorAll('.assignee-cb:checked')).map(cb => cb.value);

  if (!name) { alert('Task name required'); return; }
  const btn = document.querySelector('#modal-actions .btn-primary');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    const prevAssigneeIds = id ? getTaskAssigneeIds(state.tasks.find(t => t.id === id)) : [];
    const newAssigneeIds  = selectedIds.filter(i => !prevAssigneeIds.includes(i));

    const colVals = {
      [COLS.LAUNCH]:          currentLaunch,
      [COLS.TASK_DEPT]:       dept || null,
      [COLS.TASK_DUE]:        due ? { date: due } : null,
      [COLS.TASK_DETAILS]:    details,
      [COLS.TASK_STATUS]:     statusColVal(status),
      [COLS.TASK_COMPLETED]:  completedDate ? { date: completedDate } : null,
      [COLS.TASK_ASSIGNEE]:   { personsAndTeams: selectedIds.map(i => ({ id: parseInt(i), kind: 'person' })) }
    };

    if (id) {
      const updated = await updateItem(id, colVals);
      const task = state.tasks.find(t => t.id === id);
      if (name !== task.name) await updateName(id, name);
      task.name = name;
      task.column_values = updated.column_values;
      const gi = allItems.findIndex(i => i.id === id);
      if (gi > -1) { allItems[gi].name = name; allItems[gi].column_values = updated.column_values; }
    } else {
      const created = await createItem(GROUPS.TASKS, name, colVals);
      state.tasks.push(created);
      allItems.push(created);
    }

    // Send Monday notifications to newly assigned users
    if (newAssigneeIds.length) {
      await Promise.all(newAssigneeIds.map(userId =>
        mondayQuery(`mutation { create_notification(user_id: ${userId}, target_id: ${id || state.tasks[state.tasks.length-1]?.id}, target_type: Project, text: "You've been assigned a task for ${currentLaunch}: ${name.replace(/"/g,"'")}") { text } }`)
          .catch(() => {}) // don't fail if notification errors
      ));
    }

    renderTasks();
    closeModal();
    toast(id ? 'Task updated' : 'Task added', 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); btn.disabled = false; btn.textContent = 'Save'; }
}

  const input = document.getElementById('f-new-dept');
  const name = input?.value.trim();
  if (!name) return;
  if (departments.find(d => d.name.toLowerCase() === name.toLowerCase())) {
    toast('Department already exists', 'error'); return;
  }
  input.disabled = true;
  try {
    const colVals = JSON.stringify(JSON.stringify({ [COLS.LAUNCH]: LAUNCH_HUB_CONFIG.CONFIG_TAG }));
    const res = await mondayQuery(`mutation { create_item(board_id: ${BOARD_ID}, group_id: "${GROUPS.CONFIG}", item_name: ${JSON.stringify(name)}, column_values: ${colVals}) { id name } }`);
    const newDept = { id: String(res.create_item.id), name: res.create_item.name };
    departments.push(newDept);
    departments.sort((a,b) => a.name.localeCompare(b.name));
    allItems.push({ id: newDept.id, name: newDept.name, group: { id: GROUPS.CONFIG }, column_values: [] });
    // Refresh dept list in modal
    document.getElementById('dept-list').innerHTML = departments.map(d => `
      <div class="dept-manage-row" id="dept-row-${d.id}">
        <span class="dept-manage-name">${d.name}</span>
        <button class="btn-delete" style="opacity:.7" onclick="deleteDepartment('${d.id}','${d.name.replace(/'/g,"\\'")}')">Remove</button>
      </div>`).join('');
    input.value = '';
    input.disabled = false;
    toast('Department added', 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); input.disabled = false; }
}

async function deleteDepartment(id, name) {
  if (!confirm(`Remove "${name}"? Tasks using this department will keep the value but it won't appear in the list.`)) return;
  try {
    await mondayQuery(`mutation { delete_item(item_id: ${id}) { id } }`);
    departments = departments.filter(d => d.id !== id);
    allItems = allItems.filter(i => i.id !== id);
    const row = document.getElementById(`dept-row-${id}`);
    if (row) row.remove();
    if (!departments.length) {
      document.getElementById('dept-list').innerHTML = `<p style="color:var(--text-light);font-size:12px;text-align:center;padding:12px 0">No departments yet</p>`;
    }
    toast('Department removed', 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

function clearFilters() {
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-dept').value = '';
  document.getElementById('filter-assignee').value = '';
  renderTasks();
}

// ── INIT ──
async function init() {
  try {
    await initSDK();
    await loadAll();

    // Read launch from URL param e.g. launch.html?launch=Prison+Bar+2026
    const params = new URLSearchParams(window.location.search);
    const launchParam = params.get('launch');
    const tabParam    = params.get('tab');

    if (launchParam && launches.includes(launchParam)) {
      currentLaunch = launchParam;
    } else {
      currentLaunch = launches[launches.length - 1] || null;
    }

    populateSelector();
    if (currentLaunch) filterState();

    // If deep-linked to tasks tab (e.g. from My Tasks on home screen)
    if (tabParam === 'tasks') {
      currentTab = 'tasks';
      const userParam = params.get('user');
      const resolvedUserId = userParam || currentUserId;
      if (resolvedUserId) {
        setTimeout(() => {
          const sel = document.getElementById('filter-assignee');
          if (sel) { sel.value = resolvedUserId; }
          renderTasks();
        }, 100);
      }
      switchTab('tasks');
    }

    render();

    // Refresh shoots every 60s
    setInterval(async () => {
      try {
        const shootData = await mondayQuery(`{ boards(ids: [${SHOOT_BOARD_ID}]) { items_page(limit: 200) { items { id name group { id } column_values { id value text } } } } }`);
        allShoots = shootData.boards[0].items_page.items.filter(i => i.group.id === LAUNCH_HUB_CONFIG.SHOOT_GROUPS.REQUESTS);
        render();
      } catch {}
    }, 60000);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div style="background:var(--red-pale);border:1px solid #fecaca;border-radius:12px;padding:20px;text-align:center;color:var(--red)"><strong>Could not load from Monday.com</strong><br><span style="font-size:12px;opacity:.8">${e.message}</span></div>`;
  }
}

init();
</script>
