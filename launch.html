  sel.innerHTML = '<option value="">All Assignees</option>' +
    PAFC_USERS.filter(u => usedIds.has(u.id)).map(u => `<option value="${u.id}" ${u.id === current ? 'selected' : ''}>${u.name}</option>`).join('');
}

function isTaskOverdue(task) {
  const status = getTaskStatus(task);
  if (status === 'Completed') return false;
  const due = getCol(task, COLS.TASK_DUE);
  if (!due) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(due + 'T00:00:00') < today;
}

// Department colour palette -  consistent colours per dept name
const DEPT_COLOURS = {
  'Ecommerce':   '#7c3aed',
  'Logistics':   '#d97706',
  'Data Entry':  '#0284c7',
  'Marketing':   '#db2777',
  'Custom':      '#059669',
  'No Department': '#94a3b8'
};

function getDeptColour(name) {
  if (DEPT_COLOURS[name]) return DEPT_COLOURS[name];
  // Generate a consistent colour from name hash for unknown depts
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const colours = ['#7c3aed','#d97706','#0284c7','#db2777','#059669','#0abfbf','#ea580c','#9333ea'];
  return colours[Math.abs(hash) % colours.length];
}

function statusDot(status, isOverdue) {
  if (isOverdue) return 'overdue';
  if (status === 'Completed') return 'completed';
  if (status === 'In Progress') return 'in-progress';
  return 'assigned';
}

function renderSidebar(taskPool) {
  const allDepts = [...departments.map(d => d.name), 'No Department'];
  const usedDepts = new Set(taskPool.map(t => getCol(t, COLS.TASK_DEPT) || 'No Department'));
  const depts = allDepts.filter(d => usedDepts.has(d));

  function stats(tasks) {
    return {
      overdue:    tasks.filter(t => isTaskOverdue(t)).length,
      assigned:   tasks.filter(t => getTaskStatus(t) === 'Assigned' && !isTaskOverdue(t)).length,
      inProgress: tasks.filter(t => getTaskStatus(t) === 'In Progress' && !isTaskOverdue(t)).length,
      completed:  tasks.filter(t => getTaskStatus(t) === 'Completed').length,
      total:      tasks.length
    };
  }

  function cardHTML(deptName, tasks, isActive) {
    const s = stats(tasks);
    const pct = s.total ? Math.round((s.completed / s.total) * 100) : 0;
    const colour = getDeptColour(deptName);
    const taskListHTML = tasks.slice(0, 4).map(t => {
      const status = getTaskStatus(t);
      const overdue = isTaskOverdue(t);
      const dot = statusDot(status, overdue);
      return `<div class="dept-task-item">
        <span class="tl-dot ${dot}"></span>
        <span class="dept-task-name">${t.name}</span>
      </div>`;
    }).join('') + (tasks.length > 4 ? `<div style="font-size:10px;color:var(--text-light);padding-left:14px">+${tasks.length - 4} more</div>` : '');

    return `<div class="dept-summary-card${isActive ? ' active' : ''}" onclick="setSidebarDept('${deptName.replace(/'/g,"\\'")}')">
      <div class="dept-card-strip" style="background:${colour}"></div>
      <div class="dept-card-inner">
        <div class="dept-card-header">
          <span class="dept-card-name">${deptName}</span>
          <span class="dept-card-total">${s.total} task${s.total !== 1 ? 's' : ''}</span>
        </div>
        <div class="dept-task-list">${taskListHTML}</div>
        <div class="traffic-lights">
          ${s.overdue    ? `<span class="tl-item"><span class="tl-dot overdue"></span>${s.overdue} Overdue</span>` : ''}
          ${s.assigned   ? `<span class="tl-item"><span class="tl-dot assigned"></span>${s.assigned} Assigned</span>` : ''}
          ${s.inProgress ? `<span class="tl-item"><span class="tl-dot in-progress"></span>${s.inProgress} In Progress</span>` : ''}
          ${s.completed  ? `<span class="tl-item"><span class="tl-dot completed"></span>${s.completed} Completed</span>` : ''}
        </div>
        ${s.total ? `<div class="dept-progress"><div class="dept-progress-fill" style="width:${pct}%;background:${colour}"></div></div>` : ''}
      </div>
    </div>`;
  }

  // No All Departments card -  just per-dept cards
  // If activeSidebarDept is null (all), no card is highlighted
  const deptCards = depts.map(d => {
    const tasks = taskPool.filter(t => (getCol(t, COLS.TASK_DEPT) || 'No Department') === d);
    return cardHTML(d, tasks, activeSidebarDept === d);
  }).join('');

  document.getElementById('tasks-sidebar').innerHTML = deptCards ||
    `<div style="font-size:12px;color:var(--text-light);text-align:center;padding:20px">No tasks yet</div>`;
}

function setSidebarDept(dept) {
  activeSidebarDept = dept;
  renderTasks();
}
// ── RENDER TASKS ──
function renderTasks() {
  let taskPool;
  if (isMyTasksMode) {
    taskPool = allItems.filter(i =>
      i.group.id === GROUPS.TASKS &&
      getCol(i, COLS.LAUNCH) !== LAUNCH_HUB_CONFIG.CONFIG_TAG &&
      getCol(i, COLS.LAUNCH) !== ''
    );
    if (!taskPool.length) {
      document.getElementById('tasks-sidebar').innerHTML = '';
      document.getElementById('tasks-content').innerHTML = `<div class="tasks-empty"><h3>No tasks found</h3><p>Tasks across all launches will appear here</p></div>`;
      return;
    }
  } else {
    if (!currentLaunch) {
      document.getElementById('tasks-sidebar').innerHTML = '';
      document.getElementById('tasks-content').innerHTML = `<div class="tasks-empty"><h3>No launch selected</h3><p>Select or create a launch first</p></div>`;
      return;
    }
    taskPool = state.tasks;
    document.getElementById('tasks-title').textContent = `Tasks - ${currentLaunch}`;
  }

  populateFilters();
  renderSidebar(taskPool);

  const filterStatus   = document.getElementById('filter-status')?.value || '';
  const filterDept     = document.getElementById('filter-dept')?.value || '';
  const filterAssignee = document.getElementById('filter-assignee')?.value || '';
  const filterLaunch   = document.getElementById('filter-launch')?.value || '';

  let tasks = [...taskPool];
  if (activeSidebarDept) tasks = tasks.filter(t => (getCol(t, COLS.TASK_DEPT) || 'No Department') === activeSidebarDept);
  if (filterStatus === 'Overdue') {
    tasks = tasks.filter(t => isTaskOverdue(t));
  } else if (filterStatus) {
    tasks = tasks.filter(t => getTaskStatus(t) === filterStatus);
  }
  if (filterDept)     tasks = tasks.filter(t => getCol(t, COLS.TASK_DEPT) === filterDept);
  if (filterAssignee) tasks = tasks.filter(t => getTaskAssigneeIds(t).includes(filterAssignee));
  if (filterLaunch)   tasks = tasks.filter(t => getCol(t, COLS.LAUNCH) === filterLaunch);

  if (!tasks.length) {
    const hasFilters = filterStatus || filterDept || filterAssignee || filterLaunch || activeSidebarDept;
    document.getElementById('tasks-content').innerHTML = `<div class="tasks-empty"><h3>${hasFilters ? 'No tasks match' : 'No tasks yet'}</h3><p>${hasFilters ? 'Try clearing your filters' : 'Add your first task above'}</p></div>`;
    return;
  }

  const sortByDate = (a, b) => (getCol(a, COLS.TASK_DUE) || '9999').localeCompare(getCol(b, COLS.TASK_DUE) || '9999');
  const overdue   = tasks.filter(t => isTaskOverdue(t)).sort(sortByDate);
  const active    = tasks.filter(t => !isTaskOverdue(t) && getTaskStatus(t) !== 'Completed').sort(sortByDate);
  const completed = tasks.filter(t => getTaskStatus(t) === 'Completed').sort(sortByDate);

  let html = '';
  if (overdue.length)   html += `<div class="dept-section"><div class="dept-header" style="color:var(--red)"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px"></span>Overdue <span class="dept-count">${overdue.length}</span></div><div class="tasks-list">${overdue.map(t => taskCardHTML(t, isMyTasksMode)).join('')}</div></div>`;
  if (active.length)    html += `<div class="dept-section"><div class="dept-header"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#93c5fd;margin-right:6px"></span>Active <span class="dept-count">${active.length}</span></div><div class="tasks-list">${active.map(t => taskCardHTML(t, isMyTasksMode)).join('')}</div></div>`;
  if (completed.length) html += `<div class="dept-section"><div class="dept-header" style="color:var(--green)"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px"></span>Completed <span class="dept-count">${completed.length}</span></div><div class="tasks-list">${completed.map(t => taskCardHTML(t, isMyTasksMode)).join('')}</div></div>`;

  document.getElementById('tasks-content').innerHTML = html || `<div class="tasks-empty"><h3>No tasks yet</h3><p>Add your first task above</p></div>`;
}

function taskCardHTML(task, showLaunch) {
  const status      = getTaskStatus(task);
  const area        = getCol(task, COLS.TASK_DEPT);
  const due         = getCol(task, COLS.TASK_DUE);
  const details     = getCol(task, COLS.TASK_DETAILS);
  const launch      = getCol(task, COLS.LAUNCH);
  const assigneeIds = getTaskAssigneeIds(task);
  const assignees   = assigneeIds.map(id => getUserById(id)).filter(Boolean);

  const statusCls = status === 'Completed' ? 'completed' : status === 'In Progress' ? 'in-progress' : 'assigned';

  const dueInfo = due ? formatDueDate(due, status) : null;
  const completedDate = getCol(task, COLS.TASK_COMPLETED);
  const completedDateStr = completedDate ? new Date(completedDate + 'T00:00:00').toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : null;

  const assigneeHTML = assignees.length ? `
    <div class="assignee-wrap">
      ${assignees.map(u => `<img class="assignee-avatar" src="${u.photo}" alt="${u.name}" title="${u.name}" onerror="this.style.display='none'">`).join('')}
      <span style="font-size:11px;color:var(--text-mid)">${assignees.map(u => u.name.split(' ')[0]).join(', ')}</span>
    </div>` : '';

  const detailsHTML = details ? `<div class="task-details-text">${details.replace(/https?:\/\/[^\s]+/g, url => `<a href="${url}" target="_blank">${url}</a>`)}</div>` : '';

  const launchTag = showLaunch && launch ? `<span style="font-size:10px;font-weight:600;color:var(--text-light);background:#f0f2f5;padding:2px 8px;border-radius:20px;white-space:nowrap">⚡ ${launch}</span>` : '';

  return `<div class="task-card ${status === 'Completed' ? 'completed' : ''}">
    <div class="task-card-body">
      <div class="task-card-top">
        <span class="task-card-name">${task.name}</span>
        ${area ? `<span class="dept-pill" style="${getDeptPillStyle(area)}">${area}</span>` : ''}
        ${launchTag}
      </div>
      <div class="task-card-meta">
        <div class="status-pill-wrap">
          <select class="status-select status-select--${statusCls}" onchange="handleStatusChange('${task.id}', this.value)" onclick="event.stopPropagation()">
            <option value="Assigned" ${status==='Assigned'?'selected':''}>Assigned</option>
            <option value="In Progress" ${status==='In Progress'?'selected':''}>In Progress</option>
            <option value="Completed" ${status==='Completed'?'selected':''}>Completed</option>
          </select>
        </div>
        ${dueInfo ? `<span class="task-due ${dueInfo.cls}">&#128197; ${dueInfo.text}</span>` : ''}
        ${completedDateStr ? `<span class="completed-date">&#10003; Completed ${completedDateStr}</span>` : ''}
        ${assigneeHTML}
      </div>
      ${detailsHTML}
    </div>
    <div class="item-actions">
      <button class="btn-edit" onclick="editTaskItem('${task.id}')">Edit</button>
      <button class="btn-delete" onclick="confirmDelete('${task.id}','tasks','${task.name.replace(/'/g,"\\'")}')">Delete</button>
    </div>
  </div>`;
}

// ── CYCLE STATUS ──
async function handleStatusChange(id, newStatus) {
  if (newStatus === 'Completed') {
    cycleTaskStatus(id, 'Completed');
  } else {
    const task = state.tasks.find(t => t.id === id);
    if (!task) return;
    try {
      const colVals = {
        [COLS.TASK_STATUS]: statusColVal(newStatus),
        ...(newStatus !== 'Completed' ? { [COLS.TASK_COMPLETED]: null } : {})
      };
      const updated = await updateItem(id, colVals);
      task.column_values = updated.column_values;
      const gi = allItems.findIndex(i => i.id === id);
      if (gi > -1) allItems[gi].column_values = updated.column_values;
      cacheSet('launch', allItems);
      renderTasks(); toast(`Marked ${newStatus}`, 'success');
    } catch(e) { toast('Error: ' + e.message, 'error'); renderTasks(); }
  }
}

async function cycleTaskStatus(id, forceNext) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  const current = getTaskStatus(task);
  const next = forceNext || (current === 'Assigned' ? 'In Progress' : current === 'In Progress' ? 'Completed' : 'Assigned');

  // If cycling to Completed, prompt for completed date
  if (next === 'Completed') {
    const today = new Date().toISOString().split('T')[0];
    openModal('Mark as Completed',
      `<p style="color:var(--text-mid);margin-bottom:16px;font-size:13px">Optionally set a completed date for <strong>${task.name}</strong>.</p>
       <div class="form-group"><label class="form-label">Completed Date</label><input class="form-input" id="f-completed-date" type="date" value="${today}"></div>`,
      `<button class="btn-secondary" onclick="doMarkComplete('${id}', '')">Skip Date</button>
       <button class="btn-primary" onclick="doMarkComplete('${id}', document.getElementById('f-completed-date').value)">Mark Completed</button>`);
    return;
  }

  try {
    const colVals = { [COLS.TASK_STATUS]: statusColVal(next) };
    // If cycling back from Completed, clear the completed date
    if (current === 'Completed') colVals[COLS.TASK_COMPLETED] = null;
    const updated = await updateItem(id, colVals);
    task.column_values = updated.column_values;
    const gi = allItems.findIndex(i => i.id === id);
    if (gi > -1) allItems[gi].column_values = updated.column_values;
    cacheSet('launch', allItems);
    renderTasks(); toast(`Marked ${next}`, 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function doMarkComplete(id, completedDate) {
  const btn = document.querySelector('#modal-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  try {
    const colVals = {
      [COLS.TASK_STATUS]: statusColVal('Completed'),
      [COLS.TASK_COMPLETED]: completedDate ? { date: completedDate } : null
    };
    const updated = await updateItem(id, colVals);
    const task = state.tasks.find(t => t.id === id);
    if (task) task.column_values = updated.column_values;
    const gi = allItems.findIndex(i => i.id === id);
    if (gi > -1) allItems[gi].column_values = updated.column_values;
    cacheSet('launch', allItems);
    renderTasks(); closeModal(); toast('Marked Completed', 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Mark Completed'; } }
}

async function saveTaskItem(id) {
  const name     = document.getElementById('f-tk-name').value.trim();
  const dept     = document.getElementById('f-tk-dept').value;
  const due      = document.getElementById('f-tk-due').value;
  const details  = document.getElementById('f-tk-details').value.trim();
  const statusEl = document.getElementById('f-tk-status');
  const status   = statusEl ? statusEl.value : 'Assigned';
  const completedEl = document.getElementById('f-tk-completed');
  const completedDate = completedEl ? completedEl.value : '';

  // Get selected assignees from checkboxes
  const selectedIds = Array.from(document.querySelectorAll('.assignee-cb:checked')).map(cb => cb.value);

  if (!name) { alert('Task name required'); return; }
  const btn = document.querySelector('#modal-actions .btn-primary');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    const prevAssigneeIds = id ? getTaskAssigneeIds(state.tasks.find(t => t.id === id)) : [];
    const newAssigneeIds  = selectedIds.filter(i => !prevAssigneeIds.includes(i));

    const colVals = {
      [COLS.LAUNCH]:          currentLaunch,
      [COLS.TASK_DEPT]:       dept || null,
      [COLS.TASK_DUE]:        due ? { date: due } : null,
      [COLS.TASK_DETAILS]:    details,
      [COLS.TASK_STATUS]:     statusColVal(status),
      [COLS.TASK_COMPLETED]:  completedDate ? { date: completedDate } : null,
      [COLS.TASK_ASSIGNEE]:   { personsAndTeams: selectedIds.map(i => ({ id: parseInt(i), kind: 'person' })) }
    };

    if (id) {
      const updated = await updateItem(id, colVals);
      const task = state.tasks.find(t => t.id === id);
      if (name !== task.name) await updateName(id, name);
      task.name = name;
      task.column_values = updated.column_values;
      const gi = allItems.findIndex(i => i.id === id);
      if (gi > -1) { allItems[gi].name = name; allItems[gi].column_values = updated.column_values; }
    } else {
      const created = await createItem(GROUPS.TASKS, name, colVals);
      state.tasks.push(created);
      allItems.push(created);
    }

    // Send Monday notifications to newly assigned users
    if (newAssigneeIds.length) {
      await Promise.all(newAssigneeIds.map(userId =>
        mondayQuery(`mutation { create_notification(user_id: ${userId}, target_id: ${id || state.tasks[state.tasks.length-1]?.id}, target_type: Project, text: "You've been assigned a task for ${currentLaunch}: ${name.replace(/"/g,"'")}") { text } }`)
          .catch(() => {}) // don't fail if notification errors
      ));
    }

    renderTasks();
    closeModal();
    toast(id ? 'Task updated' : 'Task added', 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); btn.disabled = false; btn.textContent = 'Save'; }
}

// ── MANAGE DEPARTMENTS ──
function manageDepartments() {
  function deptListHTML() {
    return departments.length
      ? departments.map(d => `
          <div class="dept-manage-row" id="dept-row-${d.id}">
            <span class="dept-manage-name">${d.name}</span>
            <button class="btn-delete" style="opacity:.7" onclick="deleteDepartment('${d.id}','${d.name.replace(/'/g,"\\'")}')">Remove</button>
          </div>`).join('')
      : `<p style="color:var(--text-light);font-size:12px;text-align:center;padding:12px 0">No departments yet</p>`;
  }
  openModal('Manage Departments',
    `<div id="dept-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">${deptListHTML()}</div>
     <div style="display:flex;gap:8px">
       <input class="form-input" id="f-new-dept" placeholder="New department name..." style="flex:1">
       <button class="btn-primary" style="white-space:nowrap" onclick="addDepartment()">Add</button>
     </div>`,
    `<button class="btn-secondary" onclick="closeModal()">Done</button>`);
}

async function addDepartment() {
  const input = document.getElementById('f-new-dept');
  const name = input?.value.trim();
  if (!name) return;
  if (departments.find(d => d.name.toLowerCase() === name.toLowerCase())) {
    toast('Department already exists', 'error'); return;
  }
  input.disabled = true;
  try {
    const colVals = JSON.stringify(JSON.stringify({ [COLS.LAUNCH]: LAUNCH_HUB_CONFIG.CONFIG_TAG }));
    const res = await mondayQuery(`mutation { create_item(board_id: ${BOARD_ID}, group_id: "${GROUPS.CONFIG}", item_name: ${JSON.stringify(name)}, column_values: ${colVals}) { id name } }`);
    const newDept = { id: String(res.create_item.id), name: res.create_item.name };
    departments.push(newDept);
    departments.sort((a,b) => a.name.localeCompare(b.name));
    allItems.push({ id: newDept.id, name: newDept.name, group: { id: GROUPS.CONFIG }, column_values: [] });
    // Refresh dept list in modal
    document.getElementById('dept-list').innerHTML = departments.map(d => `
      <div class="dept-manage-row" id="dept-row-${d.id}">
        <span class="dept-manage-name">${d.name}</span>
        <button class="btn-delete" style="opacity:.7" onclick="deleteDepartment('${d.id}','${d.name.replace(/'/g,"\\'")}')">Remove</button>
      </div>`).join('');
    input.value = '';
    input.disabled = false;
    toast('Department added', 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); input.disabled = false; }
}

async function deleteDepartment(id, name) {
  if (!confirm(`Remove "${name}"? Tasks using this department will keep the value but it won't appear in the list.`)) return;
  try {
    await mondayQuery(`mutation { delete_item(item_id: ${id}) { id } }`);
    departments = departments.filter(d => d.id !== id);
    allItems = allItems.filter(i => i.id !== id);
    const row = document.getElementById(`dept-row-${id}`);
    if (row) row.remove();
    if (!departments.length) {
      document.getElementById('dept-list').innerHTML = `<p style="color:var(--text-light);font-size:12px;text-align:center;padding:12px 0">No departments yet</p>`;
    }
    toast('Department removed', 'success');
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

function clearFilters() {
  activeSidebarDept = null;
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-dept').value = '';
  document.getElementById('filter-assignee').value = '';
  const launchF = document.getElementById('filter-launch');
  if (launchF) launchF.value = '';
  renderTasks();
}

// ── INIT ──
async function init() {
  try {
    await initSDK();
    await loadAll();

    // Read launch from URL param e.g. launch.html?launch=Prison+Bar+2026
    const params = new URLSearchParams(window.location.search);
    const launchParam = params.get('launch');
    const tabParam    = params.get('tab');

    if (launchParam && launches.includes(launchParam)) {
      currentLaunch = launchParam;
    } else {
      currentLaunch = launches[launches.length - 1] || null;
    }

    populateSelector();
    if (currentLaunch) filterState();

    // If deep-linked to tasks tab (e.g. from My Tasks on home screen)
    if (tabParam === 'tasks') {
      const userParam = params.get('user');
      const resolvedUserId = userParam || currentUserId;
      const fromHome = !!tabParam; // always true here, but check if user param present = My Tasks mode
      const myTasksMode = !!userParam; // My Tasks mode when user param is in URL
      currentTab = 'tasks';
      switchTab('tasks', myTasksMode);
      if (resolvedUserId && myTasksMode) {
        setTimeout(() => {
          const sel = document.getElementById('filter-assignee');
          if (sel) { sel.value = resolvedUserId; renderTasks(); }
        }, 100);
      }
    }

    render();

    // Refresh external boards every 60s
    setInterval(async () => {
      try {
        const [shootData, graphicsData, videoData] = await Promise.all([
          mondayQuery(`{ boards(ids: [${SHOOT_BOARD_ID}]) { items_page(limit: 200) { items { id name group { id } column_values { id value text } } } } }`),
          mondayQuery(`{ boards(ids: [${GRAPHICS_BOARD_ID}]) { items_page(limit: 500) { items { id name group { id } column_values { id value text } } } } }`),
          mondayQuery(`{ boards(ids: [${VIDEO_BOARD_ID}]) { items_page(limit: 500) { items { id name group { id } column_values { id value text } } } } }`)
        ]);
        allShoots = shootData.boards[0].items_page.items.filter(i => i.group.id === LAUNCH_HUB_CONFIG.SHOOT_GROUPS.REQUESTS);
        allGraphicRequests = graphicsData.boards[0].items_page.items;
        allVideoRequests = videoData.boards[0].items_page.items;
        render();
      } catch {}
    }, 60000);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div style="background:var(--red-pale);border:1px solid #fecaca;border-radius:12px;padding:20px;text-align:center;color:var(--red)"><strong>Could not load from Monday.com</strong><br><span style="font-size:12px;opacity:.8">${e.message}</span></div>`;
  }
}

init();
</script>
